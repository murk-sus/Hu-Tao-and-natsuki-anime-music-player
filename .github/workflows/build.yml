# .github/workflows/decompile.yml
name: Decompile iOS Kernelcache

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GHIDRA_VERSION: "11.0.3"
      GHIDRA_DATE: "20240410"
      GHIDRA_HOME: /home/runner/ghidra

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # JDK 17 (Ghidra 11.x requirement)
      # -----------------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # -----------------------------------------------------------------------
      # Ghidra — restore from cache or download fresh
      # -----------------------------------------------------------------------
      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ${{ env.GHIDRA_HOME }}
          key: ghidra-11.0.3-linux-v1

      - name: Download and install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ZIP="ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip"
          URL="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/${ZIP}"
          echo "Downloading Ghidra ${GHIDRA_VERSION}"
          echo "URL: ${URL}"
          wget -q -O /tmp/ghidra.zip "${URL}"
          echo "Extracting..."
          mkdir -p "${GHIDRA_HOME}"
          unzip -q /tmp/ghidra.zip -d /tmp/ghidra_unpack
          mv /tmp/ghidra_unpack/ghidra_${GHIDRA_VERSION}_PUBLIC/* "${GHIDRA_HOME}/"
          rm -rf /tmp/ghidra.zip /tmp/ghidra_unpack
          echo "Installed:"
          ls "${GHIDRA_HOME}/support/"

      # -----------------------------------------------------------------------
      # Extract kernelcache
      # -----------------------------------------------------------------------
      - name: Extract kernel.zip
        run: |
          set -euo pipefail
          echo "Extracting kernel.zip..."
          unzip -q "${GITHUB_WORKSPACE}/kernel.zip" -d "${GITHUB_WORKSPACE}"
          ls -lh "${GITHUB_WORKSPACE}/kernel.raw"
          file "${GITHUB_WORKSPACE}/kernel.raw"

      # -----------------------------------------------------------------------
      # Ghidra headless: import -> auto-analyse -> run post-script
      # -analysisTimeoutPerFile 2700 caps analysis at 45 min, leaving buffer
      # for the 60-min job timeout.
      # -----------------------------------------------------------------------
      - name: Run Ghidra headless analysis
        env:
          _JAVA_OPTIONS: "-Xmx5g -Djava.awt.headless=true"
        run: |
          set -euo pipefail
          mkdir -p /tmp/ghidra_project
          "${GHIDRA_HOME}/support/analyzeHeadless" \
            /tmp/ghidra_project KernelProject \
            -import "${GITHUB_WORKSPACE}/kernel.raw" \
            -postScript decompile.py \
            -scriptPath "${GITHUB_WORKSPACE}/scripts" \
            -analysisTimeoutPerFile 2700 \
            2>&1 | tee /tmp/ghidra.log

      # -----------------------------------------------------------------------
      # Sanity-check the output before uploading
      # -----------------------------------------------------------------------
      - name: Verify offsets.txt
        run: |
          if [[ -f "${GITHUB_WORKSPACE}/offsets.txt" ]]; then
            echo "=== offsets.txt ==="
            cat "${GITHUB_WORKSPACE}/offsets.txt"
          else
            echo "ERROR: offsets.txt not found — tail of Ghidra log:"
            tail -100 /tmp/ghidra.log
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Upload artifact
      # -----------------------------------------------------------------------
      - name: Upload offsets artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-offsets-${{ github.sha }}
          path: ${{ github.workspace }}/offsets.txt
          retention-days: 30
