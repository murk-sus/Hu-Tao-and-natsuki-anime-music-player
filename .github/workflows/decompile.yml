name: Decompile iOS Kernelcache

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GHIDRA_VERSION: "11.0.3"
      GHIDRA_DATE: "20240410"
      GHIDRA_HOME: /home/runner/ghidra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ${{ env.GHIDRA_HOME }}
          key: ghidra-11.0.3-linux-v2

      - name: Download and install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ZIP="ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip"
          URL="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/${ZIP}"
          wget -q -O /tmp/ghidra.zip "${URL}"
          mkdir -p "${GHIDRA_HOME}"
          unzip -q /tmp/ghidra.zip -d /tmp/ghidra_unpack
          mv /tmp/ghidra_unpack/ghidra_${GHIDRA_VERSION}_PUBLIC/* "${GHIDRA_HOME}/"
          rm -rf /tmp/ghidra.zip /tmp/ghidra_unpack

      - name: Download ipsw
        run: |
          set -euo pipefail
          wget -q https://github.com/blacktop/ipsw/releases/latest/download/ipsw_linux_amd64.tar.gz
          tar xzf ipsw_linux_amd64.tar.gz
          sudo mv ipsw /usr/local/bin/ipsw
          ipsw version

      - name: Extract kernel.zip
        run: |
          set -euo pipefail
          unzip -q "${GITHUB_WORKSPACE}/kernel.zip" -d "${GITHUB_WORKSPACE}"
          ls -lh "${GITHUB_WORKSPACE}/kernel.raw"
          file "${GITHUB_WORKSPACE}/kernel.raw"

      - name: Symbolicate kernelcache
        run: |
          set -euo pipefail
          ipsw kernel symbolicate "${GITHUB_WORKSPACE}/kernel.raw" \
            --output "${GITHUB_WORKSPACE}/kernel.sym.raw" || true
          if [[ -f "${GITHUB_WORKSPACE}/kernel.sym.raw" ]]; then
            cp "${GITHUB_WORKSPACE}/kernel.sym.raw" "${GITHUB_WORKSPACE}/kernel.raw"
          fi

      - name: Run Ghidra headless analysis
        env:
          _JAVA_OPTIONS: "-Xmx6g -Djava.awt.headless=true"
        run: |
          set -euo pipefail
          mkdir -p /tmp/ghidra_project
          "${GHIDRA_HOME}/support/analyzeHeadless" \
            /tmp/ghidra_project KernelProject \
            -import "${GITHUB_WORKSPACE}/kernel.raw" \
            -postScript decompile.py \
            -scriptPath "${GITHUB_WORKSPACE}/scripts" \
            -max-cpu 4 \
            -analysisTimeoutPerFile 5400 \
            2>&1 | tee /tmp/ghidra.log

      - name: Verify offsets.txt
        run: |
          if [[ -f "${GITHUB_WORKSPACE}/offsets.txt" ]]; then
            cat "${GITHUB_WORKSPACE}/offsets.txt"
          else
            tail -100 /tmp/ghidra.log
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-offsets-${{ github.sha }}
          path: |
            ${{ github.workspace }}/offsets.txt
            /tmp/ghidra.log
          retention-days: 30
