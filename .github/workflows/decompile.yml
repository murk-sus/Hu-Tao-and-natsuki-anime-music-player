name: Extract Kernel Offsets

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      GHIDRA_VERSION: "11.0.3"
      GHIDRA_DATE: "20240410"
      GHIDRA_HOME: /home/runner/ghidra
      DEVICE: "iPhone14,5"
      IOS_VERSION: "27.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install ipsw (snap)
        run: |
          set -euo pipefail
          sudo snap install ipsw
          ipsw version

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ${{ env.GHIDRA_HOME }}
          key: ghidra-11.0.3-linux-v2

      - name: Install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ZIP="ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip"
          URL="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/${ZIP}"
          wget -q -O /tmp/ghidra.zip "${URL}"
          mkdir -p "${GHIDRA_HOME}"
          unzip -q /tmp/ghidra.zip -d /tmp/ghidra_unpack
          mv /tmp/ghidra_unpack/ghidra_${GHIDRA_VERSION}_PUBLIC/* "${GHIDRA_HOME}/"
          rm -rf /tmp/ghidra.zip /tmp/ghidra_unpack

      - name: Download IPSW
        run: |
          set -euo pipefail
          mkdir -p /tmp/ipsw_dl
          ipsw download ipsw --device "${DEVICE}" --version "${IOS_VERSION}" --output /tmp/ipsw_dl
          IPSW="$(find /tmp/ipsw_dl -name '*.ipsw' -print -quit)"
          echo "IPSW=${IPSW}" >> "${GITHUB_ENV}"

      - name: Extract Kernelcache
        run: |
          set -euo pipefail
          mkdir -p /tmp/kernel
          ipsw extract --kernel "${IPSW}" --output /tmp/kernel
          KERNEL="$(find /tmp/kernel -name 'kernelcache*' -print -quit)"
          echo "KERNEL=${KERNEL}" >> "${GITHUB_ENV}"

      - name: Clone Symbolicator signatures
        run: |
          git clone --depth 1 https://github.com/blacktop/symbolicator.git /tmp/symbolicator

      - name: Symbolicate Kernelcache
        run: |
          set -euo pipefail
          ipsw kernel symbolicate --signatures /tmp/symbolicator/kernel \
            --json "${KERNEL}" > /tmp/symbols.json || true
          ls -lh /tmp/symbols.json || true

      - name: Run Ghidra headless
        env:
          _JAVA_OPTIONS: "-Xmx6g -Djava.awt.headless=true"
        run: |
          set -euo pipefail
          mkdir -p /tmp/ghidra_project
          "${GHIDRA_HOME}/support/analyzeHeadless" \
            /tmp/ghidra_project KernelProject \
            -import "${KERNEL}" \
            -postScript decompile.py \
            -scriptPath "${GITHUB_WORKSPACE}/scripts" \
            -max-cpu 4 \
            -analysisTimeoutPerFile 9000 \
            2>&1 | tee /tmp/ghidra.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-offsets-${{ github.sha }}
          path: |
            ${{ github.workspace }}/offsets.txt
            /tmp/symbols.json
            /tmp/ghidra.log
          retention-days: 30
