name: Extract Kernel Offsets

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      DEVICE: "iPhone14,5"
      DEVICE_SLUG: "iPhone14-5"
      IOS_BUILD: "24A437"
      IOS_VERSION: "27.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Ghidra
        id: setup-ghidra
        uses: antoniovazquezblanco/setup-ghidra@v2.0.6
        with:
          version: "11.0.3"

      - name: Locate Ghidra
        run: |
          if [[ -n "${GHIDRA_INSTALL_DIR:-}" && -d "${GHIDRA_INSTALL_DIR}/support" ]]; then
            echo "GHIDRA_ROOT=${GHIDRA_INSTALL_DIR}" >> "${GITHUB_ENV}"
          else
            echo "ERROR: GHIDRA_INSTALL_DIR not set or invalid: '${GHIDRA_INSTALL_DIR:-<unset>}'"
            exit 1
          fi

      - name: Cache Ghidra project
        id: cache-project
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-${{ env.DEVICE_SLUG }}-${{ env.IOS_BUILD }}-v1

      - name: Install ipsw
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL https://api.github.com/repos/blacktop/ipsw/releases/latest \
                    | jq -r .tag_name | sed 's/^v//')
          URL="https://github.com/blacktop/ipsw/releases/download/v${LATEST}/ipsw_${LATEST}_linux_x86_64.tar.gz"
          curl -fsSL "${URL}" -o /tmp/ipsw.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/ipsw.tar.gz ipsw
          ipsw version

      - name: Cache IPSW
        id: cache-ipsw
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ipsw
          key: ipsw-${{ env.DEVICE_SLUG }}-${{ env.IOS_BUILD }}

      - name: Download IPSW
        if: steps.cache-ipsw.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ipsw"
          ipsw download ipsw \
            --device "${DEVICE}" \
            --build "${IOS_BUILD}" \
            --output "${GITHUB_WORKSPACE}/ipsw" \
            --confirm
          find "${GITHUB_WORKSPACE}/ipsw" -type f -exec ls -lh {} \;

      - name: Extract Kernelcache
        run: |
          set -euo pipefail
          IPSW_FILE="$(find "${GITHUB_WORKSPACE}/ipsw" -type f -name '*.ipsw' -print -quit)"
          if [[ -z "${IPSW_FILE}" ]]; then
            echo "ERROR: no IPSW found"
            exit 1
          fi
          mkdir -p "${GITHUB_WORKSPACE}/kernel"
          if [[ ! -f "${GITHUB_WORKSPACE}/kernel/.done" ]]; then
            ipsw extract --kernel "${IPSW_FILE}" --output "${GITHUB_WORKSPACE}/kernel"
            touch "${GITHUB_WORKSPACE}/kernel/.done"
          fi
          KERNEL="$(find "${GITHUB_WORKSPACE}/kernel" -type f \
            \( -name 'kernelcache*' -o -name '*.kernelcache' \) -not -name '.done' -print -quit)"
          if [[ -z "${KERNEL}" ]]; then
            echo "ERROR: no kernelcache found"
            ls -la "${GITHUB_WORKSPACE}/kernel/"
            exit 1
          fi
          KERNEL_NAME="$(basename "${KERNEL}")"
          echo "KERNEL=${KERNEL}" >> "${GITHUB_ENV}"
          echo "KERNEL_NAME=${KERNEL_NAME}" >> "${GITHUB_ENV}"
          echo "[+] kernel: ${KERNEL}"
          ls -lh "${KERNEL}"

      - name: Cache symbolicator signatures
        id: cache-sigs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/symbolicator
          key: symbolicator-main

      - name: Clone Symbolicator
        if: steps.cache-sigs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/blacktop/symbolicator.git \
            "${GITHUB_WORKSPACE}/symbolicator"

      - name: Cache symbols.json
        id: cache-symbols
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/symbols.json
          key: symbols-${{ env.DEVICE_SLUG }}-${{ env.IOS_BUILD }}

      - name: Symbolicate Kernelcache
        if: steps.cache-symbols.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ipsw kernel symbolicate \
            --signatures "${GITHUB_WORKSPACE}/symbolicator/kernel" \
            "${KERNEL}"
          SRC="${KERNEL}.symbols.json"
          if [[ ! -f "${SRC}" ]]; then
            SRC="$(find "${GITHUB_WORKSPACE}/kernel" -name '*.symbols.json' -print -quit)"
          fi
          if [[ ! -f "${SRC}" ]]; then
            echo "ERROR: symbolicate produced no output"
            ls -la "${GITHUB_WORKSPACE}/kernel/"
            exit 1
          fi
          cp "${SRC}" "${GITHUB_WORKSPACE}/symbols.json"
          echo "[+] symbols.json: $(wc -c < "${GITHUB_WORKSPACE}/symbols.json") bytes"

      - name: Verify symbols.json
        run: |
          set -euo pipefail
          SZ="$(stat -c %s "${GITHUB_WORKSPACE}/symbols.json")"
          if [[ "${SZ}" -lt 1000 ]]; then
            echo "ERROR: symbols.json too small (${SZ} bytes)"
            exit 1
          fi
          echo "[+] symbols.json OK: ${SZ} bytes"

      - name: Run Ghidra (warm)
        if: steps.cache-project.outputs.cache-hit == 'true'
        env:
          _JAVA_OPTIONS: "-Xmx6g -Djava.awt.headless=true"
        run: |
          set -euo pipefail
          "${GHIDRA_ROOT}/support/analyzeHeadless" \
            "${GITHUB_WORKSPACE}/ghidra_project" KernelProject \
            -process "${KERNEL_NAME}" \
            -noanalysis \
            -postScript decompile.py \
            -scriptPath "${GITHUB_WORKSPACE}/scripts" \
            2>&1 | tee "${GITHUB_WORKSPACE}/ghidra.log"

      - name: Run Ghidra (cold)
        if: steps.cache-project.outputs.cache-hit != 'true'
        env:
          _JAVA_OPTIONS: "-Xmx6g -Djava.awt.headless=true"
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ghidra_project"
          "${GHIDRA_ROOT}/support/analyzeHeadless" \
            "${GITHUB_WORKSPACE}/ghidra_project" KernelProject \
            -import "${KERNEL}" \
            -postScript decompile.py \
            -scriptPath "${GITHUB_WORKSPACE}/scripts" \
            -max-cpu 4 \
            -analysisTimeoutPerFile 9000 \
            2>&1 | tee "${GITHUB_WORKSPACE}/ghidra.log"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-offsets-${{ github.sha }}
          path: |
            ${{ github.workspace }}/offsets.txt
            ${{ github.workspace }}/symbols.json
            ${{ github.workspace }}/ghidra.log
          retention-days: 30
          if-no-files-found: warn
