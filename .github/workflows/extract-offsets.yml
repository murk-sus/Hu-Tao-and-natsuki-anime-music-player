name: Extract Offsets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      # ==================== GHIDRA ====================
      - uses: actions/cache@v4
        id: cache-ghidra
        with:
          path: ${{ github.workspace }}/ghidra
          key: ghidra-12.1.2-jython-v4

      - if: steps.cache-ghidra.outputs.cache-hit != 'true'
        name: Install Ghidra
        run: |
          set -euo pipefail
          echo "=== Ghidra cache MISS ==="
          df -h /
          curl -fsSL -o /tmp/g.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip
          unzip -q /tmp/g.zip -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/ghidra_12.1.2_PUBLIC" "$GITHUB_WORKSPACE/ghidra"
          JYTHON_ZIP=$(find "$GITHUB_WORKSPACE/ghidra/Extensions/Ghidra" -maxdepth 1 -name "*Jython*.zip" | head -n1)
          echo "JYTHON_ZIP=$JYTHON_ZIP"
          test -n "$JYTHON_ZIP"
          mkdir -p "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          unzip -q "$JYTHON_ZIP" -d "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          rm -f /tmp/g.zip

      - name: Set GHIDRA_ROOT
        run: echo "GHIDRA_ROOT=$GITHUB_WORKSPACE/ghidra" >> "$GITHUB_ENV"

      - name: Validate Ghidra
        run: |
          set -euo pipefail
          echo "GHIDRA_ROOT=$GHIDRA_ROOT"
          test -x "$GHIDRA_ROOT/support/analyzeHeadless"
          test -d "$GHIDRA_ROOT/Ghidra/Extensions/Jython"
          ls -la "$GHIDRA_ROOT/support/analyzeHeadless"
          ls -la "$GHIDRA_ROOT/Ghidra/Extensions/Jython" | head -5
          echo "Ghidra OK"

      # ==================== IPSW ====================
      - uses: actions/cache@v4
        id: cache-ipsw
        with:
          path: /usr/local/bin/ipsw
          key: ipsw-3.1.716-v4

      - if: steps.cache-ipsw.outputs.cache-hit != 'true'
        name: Install ipsw
        run: |
          set -euo pipefail
          echo "=== ipsw cache MISS ==="
          curl -fsSL -o /tmp/ipsw.tar.gz https://github.com/blacktop/ipsw/releases/download/v3.1.716/ipsw_3.1.716_linux_x86_64.tar.gz
          tar -C /usr/local/bin -xzf /tmp/ipsw.tar.gz ipsw
          rm -f /tmp/ipsw.tar.gz

      - name: Validate ipsw
        run: |
          set -euo pipefail
          test -x /usr/local/bin/ipsw
          /usr/local/bin/ipsw version
          echo "ipsw OK"

      # ==================== SYMBOLICATOR ====================
      - uses: actions/cache@v4
        id: cache-symbolicator
        with:
          path: ${{ github.workspace }}/symbolicator
          key: symbolicator-v6

      - if: steps.cache-symbolicator.outputs.cache-hit != 'true'
        name: Clone symbolicator
        run: |
          set -euo pipefail
          echo "=== symbolicator cache MISS ==="
          rm -rf "$GITHUB_WORKSPACE/symbolicator"
          git clone --depth 1 https://github.com/blacktop/symbolicator.git "$GITHUB_WORKSPACE/symbolicator"

      - name: Validate symbolicator
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/symbolicator/kernel"
          test -d "$ROOT"
          echo "=== доступные версии сигнатур ==="
          ls -1 "$ROOT"
          echo "=== количество файлов в каждой версии ==="
          for d in "$ROOT"/*/; do
            echo "  $d: $(find "$d" -type f | wc -l) files"
          done
          echo "=== пример путей файлов ==="
          find "$ROOT" -type f | head -n 20

      - id: sigs
        name: Pick signature dir
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/symbolicator/kernel"
          SIGDIR=""
          SIG_VER=""
          for V in 27.0 27.1 27.2 27.3 26.0 26.1 26.2 26.3 25.0 25.1 25.2; do
            if [ -d "$ROOT/$V" ]; then
              SIGDIR="$ROOT/$V"
              SIG_VER="$V"
              break
            fi
          done
          if [ -z "$SIGDIR" ]; then
            LATEST=$(ls -1 "$ROOT" 2>/dev/null | sort -V | tail -n1)
            if [ -n "$LATEST" ]; then
              SIGDIR="$ROOT/$LATEST"
              SIG_VER="$LATEST"
              echo "::warning::27.x нет, использую $LATEST"
            fi
          fi
          if [ -z "$SIGDIR" ]; then
            echo "::error::Ни одной папки сигнатур не найдено"
            exit 1
          fi
          COUNT=$(find "$SIGDIR" -type f | wc -l)
          echo "SIGDIR=$SIGDIR (files=$COUNT)"
          ls -la "$SIGDIR" | head -20
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Папка сигнатур пуста: $SIGDIR"
            exit 1
          fi
          echo "SIGDIR=$SIGDIR" >> "$GITHUB_ENV"
          echo "SIG_VER=$SIG_VER" >> "$GITHUB_ENV"

      # ==================== KERNELCACHE ====================
      - uses: actions/cache@v4
        id: cache-kernelcache
        with:
          path: ${{ github.workspace }}/kernelcache
          key: kernelcache-iPhone14_5-24A437-v4

      - if: steps.cache-kernelcache.outputs.cache-hit != 'true'
        name: Download and extract kernelcache
        run: |
          set -euo pipefail
          echo "=== kernelcache cache MISS ==="
          mkdir -p ipsw kernelcache
          ipsw download ipsw --device iPhone14,5 --build 24A437 --output ipsw 2>&1 | tee /tmp/dl.log || true
          IPSW=$(find ipsw -name "*.ipsw" -type f | head -n1)
          echo "IPSW=$IPSW"
          test -n "$IPSW"
          test -s "$IPSW"
          ipsw extract --kernel "$IPSW" --output kernelcache
          find kernelcache -type f ! -name "kernelcache*" -delete
          find kernelcache -type d -empty -delete
          rm -rf ipsw

      - id: kernel
        name: Locate and validate kernel
        run: |
          set -euo pipefail
          KERNEL=$(find "$GITHUB_WORKSPACE/kernelcache" -type f -name "kernelcache*" | head -n1)
          echo "KERNEL=$KERNEL"
          test -n "$KERNEL"
          test -s "$KERNEL"
          file "$KERNEL" | grep -qi "Mach-O" || (echo "::error::не Mach-O"; exit 1)
          ls -la "$KERNEL"
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=$(basename "$KERNEL")" >> "$GITHUB_ENV"

      - name: Validate scripts
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/scripts/kernel_rw.py"
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$GITHUB_WORKSPACE/scripts/kernel_rw.py"
          echo "kernel_rw.py OK"

      # ==================== SYMBOLICATE ====================
      - uses: actions/cache@v4
        id: cache-symbols
        with:
          path: ${{ github.workspace }}/symbols.json
          key: symbols-24A437-v6

      - name: Symbolicate
        if: steps.cache-symbols.outputs.cache-hit != 'true'
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/symbols.json"
          KDIR="$(dirname "$KERNEL")"
          echo "[]" > "$OUT"

          count_entries() {
            jq 'if type=="array" then length elif type=="object" then (keys|length) else 0 end' "$1" 2>/dev/null || echo 0
          }

          echo "=== [1] ipsw kernel symbolicate --json (capture stdout) ==="
          ipsw kernel symbolicate --signatures "$SIGDIR" --json "$KERNEL" \
            > /tmp/sym_out.txt 2>/tmp/sym_err.txt || true
          echo "stdout bytes: $(wc -c < /tmp/sym_out.txt 2>/dev/null || echo 0)"
          echo "--- stderr tail ---"; tail -n 30 /tmp/sym_err.txt || true

          if [ -s /tmp/sym_out.txt ] && jq empty /tmp/sym_out.txt 2>/dev/null; then
            cp /tmp/sym_out.txt "$OUT"
            echo "OK: captured JSON from stdout (entries=$(count_entries "$OUT"))"
          fi

          # Fallback A: *.symbols.json рядом с ядром или в CWD
          if [ "$(count_entries "$OUT")" = "0" ]; then
            echo "=== [2] searching for *.symbols.json ==="
            ls -la "$KDIR" || true
            FOUND=$(find "$KDIR" "$GITHUB_WORKSPACE" -maxdepth 2 -name "*.symbols.json" -type f 2>/dev/null | head -n1)
            echo "FOUND=$FOUND"
            if [ -n "$FOUND" ] && [ -s "$FOUND" ]; then
              cp "$FOUND" "$OUT"
              echo "OK: copied $FOUND (entries=$(count_entries "$OUT"))"
            fi
          fi

          # Fallback B: вложенные папки в сигнатурах
          if [ "$(count_entries "$OUT")" = "0" ]; then
            echo "=== [3] nested signature dirs ==="
            for SUB in "24A437" "iPhone14,5" "$SIG_VER"; do
              if [ -d "$SIGDIR/$SUB" ]; then
                echo "trying $SIGDIR/$SUB"
                ipsw kernel symbolicate --signatures "$SIGDIR/$SUB" --json "$KERNEL" \
                  > /tmp/sym_out.txt 2>/tmp/sym_err.txt || true
                if [ -s /tmp/sym_out.txt ] && jq empty /tmp/sym_out.txt 2>/dev/null; then
                  cp /tmp/sym_out.txt "$OUT"
                  echo "OK: via $SIGDIR/$SUB (entries=$(count_entries "$OUT"))"
                  break
                fi
              fi
            done
          fi

          # Fallback C: качаем свежие сигнатуры из интернета
          if [ "$(count_entries "$OUT")" = "0" ]; then
            echo "=== [4] internet fallback: download blacktop/symbolicator ==="
            rm -rf /tmp/sigs /tmp/sig.tar.gz
            mkdir -p /tmp/sigs
            DL_OK=0
            for URL in \
              "https://codeload.github.com/blacktop/symbolicator/tar.gz/refs/heads/master" \
              "https://codeload.github.com/blacktop/symbolicator/tar.gz/refs/heads/main"
            do
              echo "try $URL"
              if curl -fsSL -o /tmp/sig.tar.gz "$URL"; then
                tar -xzf /tmp/sig.tar.gz -C /tmp/sigs && DL_OK=1 && break
              fi
            done
            echo "DL_OK=$DL_OK"
            if [ "$DL_OK" = "1" ]; then
              NEWROOT=$(find /tmp/sigs -maxdepth 3 -type d -name kernel | head -n1)
              echo "NEWROOT=$NEWROOT"
              if [ -n "$NEWROOT" ]; then
                ls -1 "$NEWROOT" | head -20 || true
                for V in 27.0 27.1 27.2 27.3 26.0 26.1 26.2 26.3 25.0 25.1 25.2 24.0; do
                  if [ -d "$NEWROOT/$V" ]; then
                    echo "trying downloaded: $NEWROOT/$V"
                    ipsw kernel symbolicate --signatures "$NEWROOT/$V" --json "$KERNEL" \
                      > /tmp/sym_out.txt 2>/tmp/sym_err.txt || true
                    if [ -s /tmp/sym_out.txt ] && jq empty /tmp/sym_out.txt 2>/dev/null; then
                      cp /tmp/sym_out.txt "$OUT"
                      echo "OK: via downloaded $NEWROOT/$V (entries=$(count_entries "$OUT"))"
                      break
                    fi
                  fi
                done
              fi
            fi
          fi

          if ! jq empty "$OUT" 2>/dev/null; then
            echo "::warning::symbols.json невалиден, сбрасываю"
            echo "[]" > "$OUT"
          fi
          SZ=$(wc -c < "$OUT" 2>/dev/null || echo 0)
          CNT=$(count_entries "$OUT")
          echo "=== final symbols.json: $SZ bytes, entries=$CNT ==="
          head -c 800 "$OUT" || true
          echo

      - name: Validate symbols.json
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          F="$GITHUB_WORKSPACE/symbols.json"
          if [ ! -f "$F" ]; then
            echo "::error::symbols.json отсутствует"
            exit 1
          fi
          if ! jq empty "$F" 2>/dev/null; then
            echo "::error::symbols.json невалиден"
            exit 1
          fi
          TYPE=$(jq -r 'type' "$F")
          CNT=$(jq 'if type == "array" then length elif type == "object" then (keys | length) else 0 end' "$F")
          echo "top-level: $TYPE, entries: $CNT"
          if [ "$CNT" = "0" ]; then
            echo "::warning::symbols.json пустой — символы не подтянутся"
          fi

      # ==================== GHIDRA PROJECT (warm) ====================
      - uses: actions/cache@v4
        id: cache-project
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-24A437-v4

      - name: Run Ghidra
        continue-on-error: true
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          echo "cache-project hit: ${{ steps.cache-project.outputs.cache-hit }}"
          SZ=$(wc -c < "$SYMBOLS_JSON" 2>/dev/null || echo 0)
          echo "symbols.json size: $SZ"
          if [ "${{ steps.cache-project.outputs.cache-hit }}" = "true" ]; then
            echo "=== warm ==="
            "$GHIDRA_ROOT/support/analyzeHeadless" \
              "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
              -process "$KERNEL_NAME" -noanalysis \
              -postScript kernel_rw.py \
              -scriptPath "$GITHUB_WORKSPACE/scripts" \
              2>&1 | tee kernel.log || true
          else
            echo "=== cold ==="
            rm -rf ghidra_project
            mkdir -p ghidra_project
            "$GHIDRA_ROOT/support/analyzeHeadless" \
              "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
              -import "$KERNEL" \
              -processor "AARCH64:LE:64:AppleSilicon" \
              -loader BinaryLoader \
              -loader-baseAddr 0xFFFFFFF007004000 \
              -postScript kernel_rw.py \
              -scriptPath "$GITHUB_WORKSPACE/scripts" \
              -analysisTimeoutPerFile 12000 \
              -max-cpu 4 \
              2>&1 | tee kernel.log || true
          fi

      - name: Validate outputs
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "=== result.txt ==="
          if [ -s result.txt ]; then
            wc -l result.txt
            head -20 result.txt
          else
            echo "::warning::result.txt пуст"
          fi
          echo "=== offsets.json ==="
          if [ -s offsets.json ] && jq empty offsets.json 2>/dev/null; then
            echo "offsets.json valid, bytes=$(wc -c < offsets.json)"
            jq 'if type == "object" then keys else length end' offsets.json | head -20
          else
            echo "::error::offsets.json пуст или невалиден"
          fi
          echo "=== kernel.log tail ==="
          tail -n 40 kernel.log 2>/dev/null || echo "(no kernel.log)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-offsets-${{ github.sha }}
          path: |
            result.txt
            offsets.json
            kernel.log
            symbols.json
          retention-days: 30
          if-no-files-found: warn
          overwrite: true
          compression-level: 9

      - name: Cleanup workspace
        if: always()
        run: |
          set +e
          rm -rf "$GITHUB_WORKSPACE/ipsw"           2>/dev/null
          rm -rf "$GITHUB_WORKSPACE/kernelcache"    2>/dev/null
          rm -rf "$GITHUB_WORKSPACE/symbolicator"   2>/dev/null
          rm -rf "$GITHUB_WORKSPACE/ghidra"         2>/dev/null
          rm -rf "$GITHUB_WORKSPACE/ghidra_project" 2>/dev/null
          rm -f  /tmp/g.zip /tmp/ipsw.tar.gz 2>/dev/null
          rm -f  /tmp/sym_out.txt /tmp/sym_err.txt /tmp/dl.log 2>/dev/null
          rm -rf /tmp/sigs /tmp/sig.tar.gz 2>/dev/null
          rm -rf "$HOME/.config/ghidra"             2>/dev/null
          rm -rf /var/tmp/runner-ghidra             2>/dev/null
          exit 0