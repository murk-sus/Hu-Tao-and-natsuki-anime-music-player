name: Extract Kernel Offsets

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      DEVICE: "iPhone14,5"
      DEVICE_SLUG: "iPhone14-5"
      IOS_BUILD: "24A437"
      IOS_VERSION: "27.0"
      GHIDRA_VERSION: "11.0.3"
      GHIDRA_DATE: "20240410"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: /opt/ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}-${{ env.GHIDRA_DATE }}

      - name: Install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ZIP="ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip"
          URL="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/${ZIP}"
          curl -fsSL "${URL}" -o /tmp/ghidra.zip
          sudo unzip -q /tmp/ghidra.zip -d /opt/
          FOUND="$(find /opt -maxdepth 1 -type d -name 'ghidra_*' -print -quit)"
          sudo mv "${FOUND}" /opt/ghidra
          echo "GHIDRA_ROOT=/opt/ghidra" >> "${GITHUB_ENV}"

      - name: Install ipsw
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL https://api.github.com/repos/blacktop/ipsw/releases/latest | jq -r .tag_name | sed 's/^v//')
          URL="https://github.com/blacktop/ipsw/releases/download/v${LATEST}/ipsw_${LATEST}_linux_x86_64.tar.gz"
          curl -fsSL "${URL}" -o /tmp/ipsw.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/ipsw.tar.gz ipsw
          ipsw version

      - name: Cache IPSW
        id: cache-ipsw
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ipsw
          key: ipsw-${{ env.DEVICE_SLUG }}-${{ env.IOS_BUILD }}

      - name: Download IPSW
        if: steps.cache-ipsw.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ipsw"
          ipsw download ipsw --device "${DEVICE}" --build "${IOS_BUILD}" \
            --output "${GITHUB_WORKSPACE}/ipsw" --confirm
          find "${GITHUB_WORKSPACE}/ipsw" -type f -exec ls -lh {} \;

      - name: Extract Kernelcache
        run: |
          set -euo pipefail
          IPSW_FILE="$(find "${GITHUB_WORKSPACE}/ipsw" -type f -name '*.ipsw' -print -quit)"
          if [[ -z "${IPSW_FILE}" ]]; then echo "ERROR: no IPSW"; exit 1; fi
          mkdir -p "${GITHUB_WORKSPACE}/kernel"
          if [[ ! -f "${GITHUB_WORKSPACE}/kernel/.done" ]]; then
            ipsw extract --kernel "${IPSW_FILE}" --output "${GITHUB_WORKSPACE}/kernel"
            touch "${GITHUB_WORKSPACE}/kernel/.done"
          fi
          KERNEL="$(find "${GITHUB_WORKSPACE}/kernel" -type f -name 'kernelcache*' \
                    ! -name '*.plist' -print -quit)"
          if [[ -z "${KERNEL}" ]]; then
            ls -la "${GITHUB_WORKSPACE}/kernel/"
            exit 1
          fi
          KERNEL_NAME="$(basename "${KERNEL}")"
          echo "KERNEL=${KERNEL}"           >> "${GITHUB_ENV}"
          echo "KERNEL_NAME=${KERNEL_NAME}" >> "${GITHUB_ENV}"
          ls -lh "${KERNEL}"

      - name: Cache symbolicator
        id: cache-sigs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/symbolicator
          key: symbolicator-${{ env.IOS_BUILD }}

      - name: Clone symbolicator
        if: steps.cache-sigs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/blacktop/symbolicator.git \
            "${GITHUB_WORKSPACE}/symbolicator"

      - name: Cache symbols.json
        id: cache-symbols
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/symbols.json
          key: symbols-${{ env.DEVICE_SLUG }}-${{ env.IOS_BUILD }}

      - name: Symbolicate (blacktop)
        if: steps.cache-symbols.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ipsw kernel sym "${KERNEL}" --json \
            --signatures "${GITHUB_WORKSPACE}/symbolicator/kernel"
          SRC="${KERNEL}.json"
          if [[ ! -f "${SRC}" ]]; then
            SRC="$(find "${GITHUB_WORKSPACE}/kernel" -name '*.json' ! -name '.done' -print -quit)"
          fi
          if [[ ! -f "${SRC}" ]]; then
            echo "ERROR: sym output not found"
            ls -la "${GITHUB_WORKSPACE}/kernel/"
            exit 1
          fi
          cp "${SRC}" "${GITHUB_WORKSPACE}/symbols.json"
          echo "[+] symbols.json: $(wc -c < "${GITHUB_WORKSPACE}/symbols.json") bytes"

      - name: Cache iometa
        id: cache-iometa
        uses: actions/cache@v4
        with:
          path: /tmp/iometa
          key: iometa-${{ runner.os }}

      - name: Build iometa
        if: steps.cache-iometa.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev
          git clone --recursive https://github.com/Siguza/iometa.git /tmp/iometa
          cd /tmp/iometa
          make

      - name: Run iometa
        run: |
          set -euo pipefail
          /tmp/iometa/iometa -A "${KERNEL}" > "${GITHUB_WORKSPACE}/iometa_output.txt" || true
          if [[ ! -s "${GITHUB_WORKSPACE}/iometa_output.txt" ]]; then
            /tmp/iometa/iometa "${KERNEL}" > "${GITHUB_WORKSPACE}/iometa_output.txt" || true
          fi
          wc -l "${GITHUB_WORKSPACE}/iometa_output.txt"

      - name: Cache ghidra_kernelcache
        id: cache-kc
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra_kernelcache
          key: ghidra-kc-${{ runner.os }}

      - name: Clone ghidra_kernelcache
        if: steps.cache-kc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ammaraskar/ghidra_kernelcache.git \
            "${GITHUB_WORKSPACE}/ghidra_kernelcache"

      - name: Cache Ghidra project
        id: cache-project
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-${{ env.DEVICE_SLUG }}-${{ env.IOS_BUILD }}-v2

      - name: Clean old outputs
        run: |
          set -euo pipefail
          rm -f "${GITHUB_WORKSPACE}"/nk_*.txt \
                "${GITHUB_WORKSPACE}"/nk_*.h \
                "${GITHUB_WORKSPACE}"/offsets.h \
                "${GITHUB_WORKSPACE}"/offsets.json \
                "${GITHUB_WORKSPACE}"/ghidra.log

      - name: Run Ghidra (warm)
        if: steps.cache-project.outputs.cache-hit == 'true'
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GHIDRA_KC_PATH: ${{ github.workspace }}/ghidra_kernelcache
        run: |
          set -euo pipefail
          "${GHIDRA_ROOT}/support/analyzeHeadless" \
            "${GITHUB_WORKSPACE}/ghidra_project" KernelProject \
            -process "${KERNEL_NAME}" \
            -noanalysis \
            -postScript ghidra_kc_runner.py "${GITHUB_WORKSPACE}/iometa_output.txt" \
            -postScript kernel_read_offsets.py \
            -scriptPath "${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}/ghidra_kernelcache" \
            2>&1 | tee "${GITHUB_WORKSPACE}/ghidra.log"

      - name: Run Ghidra (cold)
        if: steps.cache-project.outputs.cache-hit != 'true'
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GHIDRA_KC_PATH: ${{ github.workspace }}/ghidra_kernelcache
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ghidra_project"
          "${GHIDRA_ROOT}/support/analyzeHeadless" \
            "${GITHUB_WORKSPACE}/ghidra_project" KernelProject \
            -import "${KERNEL}" \
            -postScript ghidra_kc_runner.py "${GITHUB_WORKSPACE}/iometa_output.txt" \
            -postScript kernel_read_offsets.py \
            -scriptPath "${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}/ghidra_kernelcache" \
            -max-cpu 4 \
            -analysisTimeoutPerFile 12000 \
            2>&1 | tee "${GITHUB_WORKSPACE}/ghidra.log"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-offsets-${{ github.sha }}
          path: |
            ${{ github.workspace }}/nk_kernel_rw.txt
            ${{ github.workspace }}/offsets.h
            ${{ github.workspace }}/offsets.json
            ${{ github.workspace }}/symbols.json
            ${{ github.workspace }}/iometa_output.txt
            ${{ github.workspace }}/ghidra.log
          retention-days: 30
          if-no-files-found: warn
