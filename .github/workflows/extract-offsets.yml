name: Extract Offsets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - uses: actions/cache@v4
        id: cache-ghidra
        with:
          path: ${{ github.workspace }}/ghidra
          key: ghidra-12.1.2-jython-v4

      - if: steps.cache-ghidra.outputs.cache-hit != 'true'
        name: Install Ghidra
        run: |
          set -e
          curl -fsSL -o /tmp/g.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip
          unzip -q /tmp/g.zip -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/ghidra_12.1.2_PUBLIC" "$GITHUB_WORKSPACE/ghidra"
          JYTHON_ZIP=$(find "$GITHUB_WORKSPACE/ghidra/Extensions/Ghidra" -maxdepth 1 -name "*Jython*.zip" | head -n1)
          test -n "$JYTHON_ZIP"
          mkdir -p "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          unzip -q "$JYTHON_ZIP" -d "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          rm -f /tmp/g.zip

      - name: Set GHIDRA_ROOT
        run: echo "GHIDRA_ROOT=$GITHUB_WORKSPACE/ghidra" >> "$GITHUB_ENV"

      - name: Validate Ghidra
        run: |
          set -e
          test -x "$GHIDRA_ROOT/support/analyzeHeadless"
          test -d "$GHIDRA_ROOT/Ghidra/Extensions/Jython"

      - uses: actions/cache@v4
        id: cache-ipsw
        with:
          path: /usr/local/bin/ipsw
          key: ipsw-3.1.716-v4

      - if: steps.cache-ipsw.outputs.cache-hit != 'true'
        name: Install ipsw
        run: |
          set -e
          curl -fsSL -o /tmp/ipsw.tar.gz https://github.com/blacktop/ipsw/releases/download/v3.1.716/ipsw_3.1.716_linux_x86_64.tar.gz
          tar -C /usr/local/bin -xzf /tmp/ipsw.tar.gz ipsw
          rm -f /tmp/ipsw.tar.gz

      - uses: actions/cache@v4
        id: cache-symbolicator
        with:
          path: ${{ github.workspace }}/symbolicator
          key: symbolicator-v6

      - if: steps.cache-symbolicator.outputs.cache-hit != 'true'
        name: Clone symbolicator
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/symbolicator"
          git clone --depth 1 https://github.com/blacktop/symbolicator.git "$GITHUB_WORKSPACE/symbolicator"

      - uses: actions/cache@v4
        id: cache-kernelcache
        with:
          path: ${{ github.workspace }}/kernelcache
          key: kernelcache-iPhone14_5-24A437-v4

      - if: steps.cache-kernelcache.outputs.cache-hit != 'true'
        name: Download and extract kernelcache
        run: |
          set -e
          mkdir -p ipsw kernelcache
          ipsw download ipsw --device iPhone14,5 --build 24A437 --output ipsw > /tmp/dl.log 2>&1
          IPSW=$(find ipsw -name "*.ipsw" -type f | head -n1)
          test -n "$IPSW"
          test -s "$IPSW"
          ipsw extract --kernel "$IPSW" --output kernelcache > /dev/null 2>&1
          find kernelcache -type f ! -name "kernelcache*" -delete
          find kernelcache -type d -empty -delete
          rm -rf ipsw

      - id: kernel
        name: Locate kernel
        run: |
          set -e
          KERNEL=$(find "$GITHUB_WORKSPACE/kernelcache" -type f -name "kernelcache*" | head -n1)
          test -n "$KERNEL"
          test -s "$KERNEL"
          file "$KERNEL" | grep -qi "Mach-O"
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=$(basename "$KERNEL")" >> "$GITHUB_ENV"
          echo "KERNEL_DIR=$(dirname "$KERNEL")" >> "$GITHUB_ENV"

      - name: Validate scripts
        run: |
          set -e
          test -f "$GITHUB_WORKSPACE/scripts/kernel_rw.py"
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$GITHUB_WORKSPACE/scripts/kernel_rw.py"

      - uses: actions/cache@v4
        id: cache-symbols
        with:
          path: ${{ github.workspace }}/symbols.json
          key: symbols-24A437-v12

      - name: Diagnose ipsw symbolicate
        run: |
          echo "=== ipsw version ==="
          ipsw version || true
          echo ""
          echo "=== ipsw kernel symbolicate --help ==="
          ipsw kernel symbolicate --help 2>&1 || true
          echo ""
          echo "=== ipsw kernel sym --help ==="
          ipsw kernel sym --help 2>&1 || true
          echo ""
          echo "=== ipsw kernel --help ==="
          ipsw kernel --help 2>&1 || true
          exit 0

      - name: Symbolicate
        if: steps.cache-symbols.outputs.cache-hit != 'true'
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/symbols.json"
          SIG_ROOT="$GITHUB_WORKSPACE/symbolicator/kernel/27.0"
          test -d "$SIG_ROOT"

          entries_of() {
            jq 'if type=="array" then length elif type=="object" then (keys|length) else 0 end' "$1" 2>/dev/null || echo 0
          }

          check_json_file() {
            local f="$1"
            [ -s "$f" ] && jq empty "$f" 2>/dev/null
          }

          try_one() {
            local desc="$1"; shift
            local OUTJSON="/tmp/sym_cand.json"
            rm -f "$OUTJSON"
            echo "  [$desc]"
            echo "    cmd: $*"
            "$@" > /tmp/sym_run.log 2>&1 || true
            echo "    exit=$?"
            if [ -s /tmp/sym_run.log ]; then
              echo "    log head:"; head -3 /tmp/sym_run.log | sed 's/^/      /'
            fi
            if check_json_file "$OUTJSON"; then
              local N=$(entries_of "$OUTJSON")
              echo "    -> $OUTJSON entries=$N"
              if [ "$N" -gt 0 ]; then
                cp "$OUTJSON" "$OUT"
                return 0
              fi
            fi
            return 1
          }

          try_side_effect() {
            echo "    checking side-effect files near kernel"
            local KDIR="$(dirname "$KERNEL")"
            find "$KDIR" -maxdepth 1 -type f -name "*.json" 2>/dev/null | while read f; do
              if check_json_file "$f"; then
                local N=$(entries_of "$f")
                echo "    side file: $f entries=$N"
                if [ "$N" -gt 0 ]; then
                  cp "$f" "$OUT"
                  echo "FOUND_SIDE_EFFECT=1" > /tmp/side_effect
                fi
              fi
            done
            [ -f /tmp/side_effect ]
          }

          run_variants() {
            local SIG="$1"
            local TAG="$2"
            echo ""
            echo "=== [$TAG] sig=$SIG ==="

            try_one "$TAG-A stdout --json" \
              ipsw kernel symbolicate --signatures "$SIG" --json "$KERNEL" && return 0
            try_one "$TAG-B kernel first --json file" \
              ipsw kernel symbolicate "$KERNEL" --signatures "$SIG" --json /tmp/sym_cand.json && return 0
            try_one "$TAG-C kernel first --json stdout" \
              ipsw kernel symbolicate "$KERNEL" --signatures "$SIG" --json && return 0
            try_one "$TAG-D kernel first only" \
              ipsw kernel symbolicate "$KERNEL" --signatures "$SIG" && return 0
            try_one "$TAG-E kernel first --output" \
              ipsw kernel symbolicate "$KERNEL" --signatures "$SIG" --output /tmp/sym_cand.json && return 0
            try_one "$TAG-F kernel first -o" \
              ipsw kernel symbolicate "$KERNEL" --signatures "$SIG" -o /tmp/sym_cand.json && return 0
            try_one "$TAG-G sym first" \
              ipsw kernel sym "$KERNEL" --signatures "$SIG" --json /tmp/sym_cand.json && return 0
            try_one "$TAG-H sym kernel first no flags" \
              ipsw kernel sym "$KERNEL" --signatures "$SIG" && return 0
            try_one "$TAG-I positional sig first" \
              ipsw kernel symbolicate "$SIG" "$KERNEL" --json /tmp/sym_cand.json && return 0
            try_side_effect && return 0
            return 1
          }

          run_variants "$SIG_ROOT" "27.0-full" && { echo "OK full"; exit 0; }
          run_variants "$SIG_ROOT/kexts" "27.0-kexts" && { echo "OK kexts"; exit 0; }
          run_variants "$SIG_ROOT/xnu.json" "27.0-xnu" && { echo "OK xnu"; exit 0; }

          echo ""
          echo "::error::all variants failed - dumping available logs"
          for f in /tmp/sym_run.log /tmp/sym_a.log /tmp/sym_b.log /tmp/sym_c.log; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              tail -30 "$f"
            fi
          done
          exit 1

      - uses: actions/cache@v4
        id: cache-project
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-24A437-v4

      - name: Run Ghidra
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -e
          echo "cache-project: ${{ steps.cache-project.outputs.cache-hit }}"
          test -f "$SYMBOLS_JSON"
          SZ=$(wc -c < "$SYMBOLS_JSON")
          test "$SZ" -gt 3
          echo "symbols.json: $SZ bytes"
          if [ "${{ steps.cache-project.outputs.cache-hit }}" = "true" ]; then
            "$GHIDRA_ROOT/support/analyzeHeadless" \
              "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
              -process "$KERNEL_NAME" -noanalysis \
              -postScript kernel_rw.py \
              -scriptPath "$GITHUB_WORKSPACE/scripts" \
              > kernel.log 2>&1
          else
            rm -rf ghidra_project
            mkdir -p ghidra_project
            "$GHIDRA_ROOT/support/analyzeHeadless" \
              "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
              -import "$KERNEL" \
              -processor "AARCH64:LE:64:AppleSilicon" \
              -loader BinaryLoader \
              -loader-baseAddr 0xFFFFFFF007004000 \
              -postScript kernel_rw.py \
              -scriptPath "$GITHUB_WORKSPACE/scripts" \
              -analysisTimeoutPerFile 12000 \
              -max-cpu 4 \
              > kernel.log 2>&1
          fi

      - name: Verify outputs
        run: |
          set -e
          test -s result.txt
          test -s offsets.json
          jq empty offsets.json
          echo "result.txt: $(wc -l < result.txt) lines"
          echo "offsets.json: $(wc -c < offsets.json) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-offsets-${{ github.sha }}
          path: |
            result.txt
            offsets.json
            kernel.log
            symbols.json
          retention-days: 30
          overwrite: true
          compression-level: 9

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/ipsw" "$GITHUB_WORKSPACE/kernelcache" \
                 "$GITHUB_WORKSPACE/symbolicator" "$GITHUB_WORKSPACE/ghidra" \
                 "$GITHUB_WORKSPACE/ghidra_project"
          rm -f /tmp/g.zip /tmp/ipsw.tar.gz /tmp/sym_run.log /tmp/sym_cand.json \
                /tmp/sym_a.log /tmp/sym_b.log /tmp/sym_c.log /tmp/dl.log /tmp/side_effect
          rm -rf "$HOME/.config/ghidra" /var/tmp/runner-ghidra
          exit 0