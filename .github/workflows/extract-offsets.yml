name: Extract Kernel Offsets

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Install Ghidra
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ghidra.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.4.2_build/ghidra_11.4.2_PUBLIC_20250826.zip
          unzip -q /tmp/ghidra.zip -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE"/ghidra_11.4.2_PUBLIC "$GITHUB_WORKSPACE/ghidra"
          echo "GHIDRA_ROOT=$GITHUB_WORKSPACE/ghidra" >> "$GITHUB_ENV"

      - name: Unpack kernel
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel"
          unzip -o "$GITHUB_WORKSPACE/kernel.zip" -d "$GITHUB_WORKSPACE/kernel"
          KERNEL="$(find "$GITHUB_WORKSPACE/kernel" -type f \( -name 'kernel.raw' -o -name 'kernelcache*' \) -print -quit)"
          test -n "$KERNEL" || { echo "no kernel found"; find "$GITHUB_WORKSPACE/kernel" -type f; exit 1; }
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=$(basename "$KERNEL")" >> "$GITHUB_ENV"
          ls -lh "$KERNEL"

      - name: Cache Ghidra project
        id: cache-project
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-${{ hashFiles('kernel.zip', 'scripts/**') }}

      - name: Run Ghidra (warm)
        id: warm
        if: steps.cache-project.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/ghidra_project/KernelProject.rep/project.prp" || exit 1
          test -d "$GITHUB_WORKSPACE/ghidra_project/KernelProject.rep/idata" || exit 1
          "$GHIDRA_ROOT/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
            -process "$KERNEL_NAME" \
            -noanalysis \
            -postScript kernel_rw.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            2>&1 | tee "$GITHUB_WORKSPACE/ghidra.log"

      - name: Run Ghidra (cold)
        if: steps.cache-project.outputs.cache-hit != 'true' || steps.warm.outcome != 'success'
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/ghidra_project"
          mkdir -p "$GITHUB_WORKSPACE/ghidra_project"
          "$GHIDRA_ROOT/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
            -import "$KERNEL" \
            -postScript kernel_rw.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -max-cpu 4 \
            2>&1 | tee "$GITHUB_WORKSPACE/ghidra.log"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-offsets-${{ github.sha }}
          path: |
            ${{ github.workspace }}/offsets.h
            ${{ github.workspace }}/offsets.json
            ${{ github.workspace }}/nk_kernel_rw.txt
            ${{ github.workspace }}/ghidra.log
          retention-days: 30
