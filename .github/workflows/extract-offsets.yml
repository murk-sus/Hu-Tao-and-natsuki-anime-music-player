name: Extract Kernel Offsets

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  offsets:
    runs-on: macos-latest
    timeout-minutes: 300

    env:
      DEVICE: "iPhone14,5"
      DEVICE_SLUG: "iPhone14-5"
      IOS_BUILD: "24A437"
      IOS_VERSION: "27.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-macOS-${{ hashFiles('.github/workflows/extract-kernel-offsets.yml') }}
          restore-keys: brew-macOS-

      - name: Install tools
        run: |
          set -euo pipefail
          brew install xcodegen ldid ipsw
          brew link --overwrite xcodegen ldid ipsw

      - name: Setup Ghidra
        run: |
          set -euo pipefail
          if ! brew list ghidra >/dev/null 2>&1; then
            brew install --cask ghidra
          fi
          echo "GHIDRA_ROOT=/Applications/ghidra_11.0.3_PUBLIC" >> "${GITHUB_ENV}"

      - name: Locate Ghidra
        run: |
          set -euo pipefail
          if [[ ! -d "${GHIDRA_ROOT}/support" ]]; then
            FOUND="$(find /Applications /opt -maxdepth 2 -type d -name 'ghidra_*' -print -quit 2>/dev/null || true)"
            if [[ -z "${FOUND}" ]]; then
              echo "ERROR: Ghidra not found"
              exit 1
            fi
            echo "GHIDRA_ROOT=${FOUND}" >> "${GITHUB_ENV}"
          fi
          ls -la "${GHIDRA_ROOT}/support/analyzeHeadless"

      - name: Cache IPSW
        id: cache-ipsw
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ipsw
          key: ipsw-${{ env.DEVICE_SLUG }}-${{ env.IOS_BUILD }}

      - name: Download IPSW
        if: steps.cache-ipsw.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ipsw"
          ipsw download ipsw \
            --device "${DEVICE}" \
            --build "${IOS_BUILD}" \
            --output "${GITHUB_WORKSPACE}/ipsw" \
            --confirm

      - name: Extract Kernelcache
        run: |
          set -euo pipefail
          IPSW="$(find "${GITHUB_WORKSPACE}/ipsw" -type f -name '*.ipsw' -print -quit)"
          if [[ -z "${IPSW}" ]]; then
            echo "ERROR: no IPSW found"
            exit 1
          fi
          mkdir -p "${GITHUB_WORKSPACE}/kernel"
          KERNEL="$(find "${GITHUB_WORKSPACE}/kernel" -type f \( -name 'kernelcache*' -o -name '*.kernelcache' \) -print -quit)"
          if [[ -z "${KERNEL}" ]]; then
            ipsw extract --kernel "${IPSW}" --output "${GITHUB_WORKSPACE}/kernel"
            KERNEL="$(find "${GITHUB_WORKSPACE}/kernel" -type f \( -name 'kernelcache*' -o -name '*.kernelcache' \) -print -quit)"
          fi
          if [[ -z "${KERNEL}" ]]; then
            echo "ERROR: kernelcache not found"
            exit 1
          fi
          echo "KERNEL=${KERNEL}" >> "${GITHUB_ENV}"
          ls -lh "${KERNEL}"

      - name: Cache Symbolicator
        id: cache-sigs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/symbolicator
          key: symbolicator-main

      - name: Clone Symbolicator
        if: steps.cache-sigs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/blacktop/symbolicator.git \
            "${GITHUB_WORKSPACE}/symbolicator"

      - name: Symbolicate Kernelcache
        run: |
          set -euo pipefail
          rm -f "${GITHUB_WORKSPACE}/symbols.json"
          ipsw kernel symbolicate \
            --signatures "${GITHUB_WORKSPACE}/symbolicator/kernel" \
            --json "${KERNEL}" || true
          SRC=""
          for cand in "${KERNEL}.symbols.json" "${GITHUB_WORKSPACE}/symbols.json"; do
            if [[ -f "${cand}" ]] && [[ -s "${cand}" ]]; then
              SRC="${cand}"
              break
            fi
          done
          if [[ -z "${SRC}" ]]; then
            SRC="$(find "${GITHUB_WORKSPACE}" /tmp /home/runner -name '*.symbols.json' -size +1k -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "${SRC}" ]]; then
            echo "ERROR: symbolication output not found"
            exit 1
          fi
          cp "${SRC}" "${GITHUB_WORKSPACE}/symbols.json"
          echo "[+] symbols.json OK ($(stat -f %z "${GITHUB_WORKSPACE}/symbols.json") bytes)"

      - name: Cache Ghidra project
        id: cache-project
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-${{ env.DEVICE_SLUG }}-${{ env.IOS_BUILD }}-v4

      - name: Run Ghidra (warm)
        if: steps.cache-project.outputs.cache-hit == 'true'
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
        run: |
          set -euo pipefail
          "${GHIDRA_ROOT}/support/analyzeHeadless" \
            "${GITHUB_WORKSPACE}/ghidra_project" KernelProject \
            -process "kernelcache.release.iPhone14,5" \
            -noanalysis \
            -postScript kernel_kw_hunt.py \
            -scriptPath "${GITHUB_WORKSPACE}/scripts" \
            2>&1 | tee "${GITHUB_WORKSPACE}/ghidra.log"

      - name: Run Ghidra (cold)
        if: steps.cache-project.outputs.cache-hit != 'true'
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ghidra_project"
          "${GHIDRA_ROOT}/support/analyzeHeadless" \
            "${GITHUB_WORKSPACE}/ghidra_project" KernelProject \
            -import "${KERNEL}" \
            -postScript kernel_kw_hunt.py \
            -scriptPath "${GITHUB_WORKSPACE}/scripts" \
            -max-cpu 4 \
            -analysisTimeoutPerFile 12000 \
            2>&1 | tee "${GITHUB_WORKSPACE}/ghidra.log"

      - name: Save Ghidra project after cold
        if: steps.cache-project.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-${{ env.DEVICE_SLUG }}-${{ env.IOS_BUILD }}-v4

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-offsets-${{ github.sha }}
          path: |
            ${{ github.workspace }}/nk_sysent.txt
            ${{ github.workspace }}/nk_anchors.h
            ${{ github.workspace }}/nk_necp_full.txt
            ${{ github.workspace }}/nk_zone_offsets.txt
            ${{ github.workspace }}/nk_kalloc_sites.txt
            ${{ github.workspace }}/nk_copy_ops.txt
            ${{ github.workspace }}/nk_iokit_methods.txt
            ${{ github.workspace }}/nk_kw_gadgets.txt
            ${{ github.workspace }}/nk_uaf_candidates.txt
            ${{ github.workspace }}/nk_report.txt
            ${{ github.workspace }}/ghidra.log
          retention-days: 30
          if-no-files-found: warn
