name: Extract Offsets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Clean stale outputs
        run: |
          rm -f result.txt offsets.json kernel.log symbols.json
          rm -f /tmp/so.txt /tmp/se.txt /tmp/sym_out.txt /tmp/sym_err.txt /tmp/dl.log
          rm -rf /tmp/sigs /tmp/sig.tar.gz

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - uses: actions/cache@v4
        id: cache-ghidra
        with:
          path: ${{ github.workspace }}/ghidra
          key: ghidra-12.1.2-jython-v4

      - if: steps.cache-ghidra.outputs.cache-hit != 'true'
        name: Install Ghidra
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/g.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip
          unzip -q /tmp/g.zip -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/ghidra_12.1.2_PUBLIC" "$GITHUB_WORKSPACE/ghidra"
          JYTHON_ZIP=$(find "$GITHUB_WORKSPACE/ghidra/Extensions/Ghidra" -maxdepth 1 -name "*Jython*.zip" | head -n1)
          test -n "$JYTHON_ZIP"
          mkdir -p "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          unzip -q "$JYTHON_ZIP" -d "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          rm -f /tmp/g.zip

      - name: Set GHIDRA_ROOT
        run: echo "GHIDRA_ROOT=$GITHUB_WORKSPACE/ghidra" >> "$GITHUB_ENV"

      - name: Validate Ghidra
        run: |
          set -euo pipefail
          test -x "$GHIDRA_ROOT/support/analyzeHeadless"
          test -d "$GHIDRA_ROOT/Ghidra/Extensions/Jython"

      - uses: actions/cache@v4
        id: cache-ipsw
        with:
          path: /usr/local/bin/ipsw
          key: ipsw-3.1.716-v4

      - if: steps.cache-ipsw.outputs.cache-hit != 'true'
        name: Install ipsw
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ipsw.tar.gz https://github.com/blacktop/ipsw/releases/download/v3.1.716/ipsw_3.1.716_linux_x86_64.tar.gz
          tar -C /usr/local/bin -xzf /tmp/ipsw.tar.gz ipsw
          rm -f /tmp/ipsw.tar.gz

      - uses: actions/cache@v4
        id: cache-symbolicator
        with:
          path: ${{ github.workspace }}/symbolicator
          key: symbolicator-v6

      - if: steps.cache-symbolicator.outputs.cache-hit != 'true'
        name: Clone symbolicator
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/symbolicator"
          git clone --depth 1 https://github.com/blacktop/symbolicator.git "$GITHUB_WORKSPACE/symbolicator"

      - id: sigs
        name: Pick signature dir
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/symbolicator/kernel"
          test -d "$ROOT" || { echo "::error::no symbolicator"; exit 1; }
          SIGDIR=""
          for V in 27.0 27.1 27.2 27.3 26.0 26.1 26.2 26.3 25.6 25.5 25.4 25.3; do
            if [ -d "$ROOT/$V" ]; then SIGDIR="$ROOT/$V"; break; fi
          done
          test -n "$SIGDIR" || { echo "::error::no version dir"; exit 1; }
          echo "SIGDIR=$SIGDIR" >> "$GITHUB_ENV"
          echo "picked $SIGDIR"

      - uses: actions/cache@v4
        id: cache-kernelcache
        with:
          path: ${{ github.workspace }}/kernelcache
          key: kernelcache-iPhone14_5-24A437-v4

      - if: steps.cache-kernelcache.outputs.cache-hit != 'true'
        name: Download and extract kernelcache
        run: |
          set -euo pipefail
          mkdir -p ipsw kernelcache
          ipsw download ipsw --device iPhone14,5 --build 24A437 --output ipsw 2>&1 | tee /tmp/dl.log || true
          IPSW=$(find ipsw -name "*.ipsw" -type f | head -n1)
          test -n "$IPSW"
          test -s "$IPSW"
          ipsw extract --kernel "$IPSW" --output kernelcache
          find kernelcache -type f ! -name "kernelcache*" -delete
          find kernelcache -type d -empty -delete
          rm -rf ipsw

      - id: kernel
        name: Locate kernel
        run: |
          set -euo pipefail
          KERNEL=$(find "$GITHUB_WORKSPACE/kernelcache" -type f -name "kernelcache*" | head -n1)
          test -n "$KERNEL"
          file "$KERNEL" | grep -qi "Mach-O"
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "KERNEL_DIR=$(dirname "$KERNEL")" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=$(basename "$KERNEL")" >> "$GITHUB_ENV"

      - name: Validate scripts
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/scripts/kernel_rw.py"
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$GITHUB_WORKSPACE/scripts/kernel_rw.py"

      - name: Symbolicate
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/symbols.json"
          rm -f "$OUT"

          count_entries() {
            jq 'if type=="array" then length elif type=="object" then (keys|length) else 0 end' "$1" 2>/dev/null || echo 0
          }

          grab() {
            local f="$1"
            if [ -z "$f" ] || [ "$f" = "$OUT" ]; then return 1; fi
            if [ ! -f "$f" ] || [ ! -s "$f" ]; then return 1; fi
            if ! jq empty "$f" 2>/dev/null; then return 1; fi
            local N=$(count_entries "$f")
            if [ "$N" -ge 10 ]; then
              cp "$f" "$OUT"
              echo "    GRAB $f -> $N entries"
              return 0
            fi
            return 1
          }

          run_one() {
            local SIG="$1"
            local TAG="$2"
            [ -e "$SIG" ] || return 1
            echo ""
            echo "=== [$TAG] $SIG ==="

            rm -f /tmp/symbols.json
            rm -f "$GITHUB_WORKSPACE/symbols.json.tmp"
            rm -f "$KERNEL_DIR/symbols.json"
            rm -f "$KERNEL_DIR/$KERNEL_NAME.json"

            ipsw kernel symbolicate --signatures "$SIG" --json "$KERNEL" \
              > /tmp/so.txt 2> /tmp/se.txt
            local RC=$?
            local SO=$(wc -c < /tmp/so.txt 2>/dev/null || echo 0)
            echo "    rc=$RC stdout=$SO"

            if grab /tmp/so.txt; then return 0; fi

            local RP=$(grep -oE "Writing symbols as JSON to .+" /tmp/se.txt 2>/dev/null | head -1 | sed 's/^.* to //' | tr -d '\r\n')
            if [ -n "$RP" ]; then
              echo "    reported: $RP"
              if grab "$RP"; then return 0; fi
              if grab "$GITHUB_WORKSPACE/$RP"; then return 0; fi
            fi

            for f in \
              "$KERNEL_DIR/$KERNEL_NAME.json" \
              "$KERNEL_DIR/symbols.json" \
              "$GITHUB_WORKSPACE/symbols.json.tmp" \
              "/tmp/symbols.json"; do
              if grab "$f"; then return 0; fi
            done

            for f in $(find "$GITHUB_WORKSPACE/kernelcache" -maxdepth 4 -name "*.json" -type f 2>/dev/null); do
              if grab "$f"; then return 0; fi
            done

            for f in $(find "$GITHUB_WORKSPACE" -maxdepth 5 -name "*.json" -type f -newermt "3 minutes ago" 2>/dev/null | grep -v ghidra | grep -v symbolicator | grep -v scripts); do
              if grab "$f"; then return 0; fi
            done

            echo "    no candidate"
            return 1
          }

          if run_one "$SIGDIR" "full-27.0"; then echo "OK full"
          elif run_one "$SIGDIR/xnu.json" "xnu"; then echo "OK xnu"
          elif run_one "$SIGDIR/kexts" "kexts"; then echo "OK kexts"
          else
            echo "::error::symbolication failed"
            echo "--- stderr tail ---"
            tail -20 /tmp/se.txt 2>/dev/null || true
            echo "--- files found ---"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -name "*.json" -newermt "5 minutes ago" 2>/dev/null | grep -v ghidra | grep -v symbolicator | head -20
            exit 1
          fi

          test -f "$OUT"
          jq empty "$OUT"
          CNT=$(count_entries "$OUT")
          SZ=$(wc -c < "$OUT")
          echo ""
          echo "=== symbols.json: $SZ bytes, $CNT entries ==="
          test "$CNT" -gt 0
          head -c 400 "$OUT"
          echo ""

      - uses: actions/cache@v4
        id: cache-project
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-24A437-v4

      - name: Run Ghidra
        env:
          _JAVA_OPTIONS: "-Xmx12g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "cache-project: ${{ steps.cache-project.outputs.cache-hit }}"
          test -f "$SYMBOLS_JSON"
          SZ=$(wc -c < "$SYMBOLS_JSON")
          echo "symbols.json: $SZ bytes"
          test "$SZ" -gt 10
          JOBS=$(nproc)
          echo "jobs: $JOBS"
          if [ "${{ steps.cache-project.outputs.cache-hit }}" = "true" ]; then
            echo "=== warm ==="
            "$GHIDRA_ROOT/support/analyzeHeadless" \
              "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
              -process "$KERNEL_NAME" -noanalysis \
              -postScript kernel_rw.py \
              -scriptPath "$GITHUB_WORKSPACE/scripts" \
              2>&1 | tee kernel.log
          else
            echo "=== cold ==="
            rm -rf ghidra_project
            mkdir -p ghidra_project
            "$GHIDRA_ROOT/support/analyzeHeadless" \
              "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
              -import "$KERNEL" \
              -processor "AARCH64:LE:64:AppleSilicon" \
              -loader BinaryLoader \
              -loader-baseAddr 0xFFFFFFF007004000 \
              -postScript kernel_rw.py \
              -scriptPath "$GITHUB_WORKSPACE/scripts" \
              -analysisTimeoutPerFile 3600 \
              -max-cpu "$JOBS" \
              2>&1 | tee kernel.log
          fi

      - name: Validate outputs
        run: |
          set -euo pipefail
          test -s result.txt
          LINES=$(wc -l < result.txt)
          echo "result.txt: $LINES lines"
          test "$LINES" -gt 50

          test -s offsets.json
          jq empty offsets.json
          echo "offsets: $(jq 'length' offsets.json) entries"

          test -s kernel.log
          if grep -qE "FATAL|Exception" kernel.log; then
            grep -E "FATAL|Exception" kernel.log | head -5
            exit 1
          fi
          echo "OK"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-offsets-${{ github.sha }}
          path: |
            result.txt
            offsets.json
            kernel.log
            symbols.json
          retention-days: 30
          overwrite: true
          compression-level: 9

      - name: Cleanup tmp only
        if: always()
        run: |
          set +e
          rm -rf "$GITHUB_WORKSPACE/ipsw"
          rm -f /tmp/g.zip /tmp/ipsw.tar.gz /tmp/so.txt /tmp/se.txt /tmp/sym_out.txt /tmp/sym_err.txt /tmp/dl.log
          rm -rf /tmp/sigs /tmp/sig.tar.gz
          rm -rf "$HOME/.config/ghidra" /var/tmp/runner-ghidra
          exit 0