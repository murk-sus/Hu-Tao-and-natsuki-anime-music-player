name: Extract Kernel & SPTM Offsets

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Install Ghidra
        run: |
          curl -fsSL -o /tmp/g.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.4.2_build/ghidra_11.4.2_PUBLIC_20250826.zip
          unzip -q /tmp/g.zip -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE"/ghidra_11.4.2_PUBLIC "$GITHUB_WORKSPACE/ghidra"
          echo "GHIDRA_ROOT=$GITHUB_WORKSPACE/ghidra" >> "$GITHUB_ENV"

      - name: Install ipsw
        run: |
          V=$(curl -fsSL https://api.github.com/repos/blacktop/ipsw/releases/latest | jq -r .tag_name | sed 's/^v//')
          curl -fsSL -o /tmp/i.tgz "https://github.com/blacktop/ipsw/releases/download/v${V}/ipsw_${V}_linux_x86_64.tar.gz"
          tar -C /usr/local/bin -xzf /tmp/i.tgz ipsw
          ipsw version

      - name: Clone symbolicator
        run: git clone --depth 1 https://github.com/blacktop/symbolicator.git "$GITHUB_WORKSPACE/symbolicator"

      - name: Unpack archives
        run: |
          mkdir -p kernel sptm
          unzip -o kernel.zip -d kernel
          unzip -o sptm.zip -d sptm
          K=$(find kernel -type f \( -name 'kernel.raw' -o -name 'kernelcache*' \) -print -quit)
          S=$(find sptm -type f \( -name 'sptm.raw' -o -name 'sptm.*.release' \) -print -quit)
          test -n "$K" && test -n "$S"
          echo "KERNEL=$K" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=$(basename "$K")" >> "$GITHUB_ENV"
          echo "SPTM=$S" >> "$GITHUB_ENV"
          echo "SPTM_NAME=$(basename "$S")" >> "$GITHUB_ENV"
          ls -lh "$K" "$S"

      - name: Cache symbols
        id: cs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/symbols.json
          key: symbols-${{ hashFiles('kernel.zip') }}

      - name: Symbolicate
        if: steps.cs.outputs.cache-hit != 'true'
        run: |
          ipsw kernel sym "$KERNEL" --json --signatures "$GITHUB_WORKSPACE/symbolicator/kernel"
          SRC="${KERNEL}.json"
          [[ -f "$SRC" ]] || SRC=$(find kernel -name '*.json' -print -quit)
          test -f "$SRC"
          cp "$SRC" "$GITHUB_WORKSPACE/symbols.json"
          test -s "$GITHUB_WORKSPACE/symbols.json"
          echo "[+] symbols: $(wc -c < "$GITHUB_WORKSPACE/symbols.json") bytes"

      - name: Cache kernel project
        id: ckp
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_project
          key: kernel-project-${{ hashFiles('kernel.zip') }}

      - name: Kernel warm
        id: kw
        if: steps.ckp.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          "$GHIDRA_ROOT/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/kernel_project" KernelProject \
            -process "$KERNEL_NAME" -noanalysis \
            -postScript kernel_rw.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            2>&1 | tee kernel.log

      - name: Kernel cold
        if: steps.ckp.outputs.cache-hit != 'true' || steps.kw.outcome != 'success'
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          rm -rf kernel_project
          mkdir -p kernel_project
          "$GHIDRA_ROOT/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/kernel_project" KernelProject \
            -import "$KERNEL" \
            -postScript kernel_rw.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -analysisTimeoutPerFile 12000 \
            -max-cpu 4 \
            2>&1 | tee kernel.log

      - name: Cache SPTM project
        id: csp
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/sptm_project
          key: sptm-project-${{ hashFiles('sptm.zip') }}

      - name: SPTM warm
        id: sw
        if: steps.csp.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          _JAVA_OPTIONS: "-Xmx6g -Djava.awt.headless=true"
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          "$GHIDRA_ROOT/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/sptm_project" SptmProject \
            -process "$SPTM_NAME" -noanalysis \
            -postScript sptm_rw.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            2>&1 | tee sptm.log

      - name: SPTM cold
        if: steps.csp.outputs.cache-hit != 'true' || steps.sw.outcome != 'success'
        env:
          _JAVA_OPTIONS: "-Xmx6g -Djava.awt.headless=true"
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          rm -rf sptm_project
          mkdir -p sptm_project
          "$GHIDRA_ROOT/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/sptm_project" SptmProject \
            -import "$SPTM" \
            -postScript sptm_rw.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -analysisTimeoutPerFile 6000 \
            -max-cpu 4 \
            2>&1 | tee sptm.log

      - name: Validate
        if: always()
        run: |
          ls -la offsets.json offsets.h nk_kernel_rw.txt sptm_offsets.json 2>&1 || true
          test -s offsets.json
          test -s offsets.h
          jq empty offsets.json || true
          [ -s sptm_offsets.json ] && jq empty sptm_offsets.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offsets-${{ github.sha }}
          path: |
            offsets.h
            offsets.json
            nk_kernel_rw.txt
            kernel.log
            sptm_offsets.json
            sptm_offsets.h
            sptm_report.txt
            sptm.log
            symbols.json
          retention-days: 30
          if-no-files-found: warn