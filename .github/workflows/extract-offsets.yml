name: Extract Kernel Offsets

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DEVICE: "iPhone14,5"
      DEVICE_SLUG: "iPhone14-5"
      IOS_BUILD: "24A437"
      IOS_VERSION: "27.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Ghidra install
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: /opt/ghidra
          key: ghidra-11.0.3-linux

      - name: Setup Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        uses: antoniovazquezblanco/setup-ghidra@v2.0.6
        with:
          version: "11.0.3"
          install-path: /opt/ghidra

      - name: Locate Ghidra
        run: |
          if [[ -d /opt/ghidra/support ]]; then
            echo "GHIDRA_ROOT=/opt/ghidra" >> "${GITHUB_ENV}"
          elif [[ -n "${GHIDRA_INSTALL_DIR:-}" ]]; then
            echo "GHIDRA_ROOT=${GHIDRA_INSTALL_DIR}" >> "${GITHUB_ENV}"
          else
            echo "ERROR: Ghidra not found"
            exit 1
          fi

      - name: Install ipsw
        run: |
          set -euo pipefail
          sudo snap install ipsw || true
          ipsw version

      - name: Cache IPSW
        id: cache-ipsw
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ipsw
          key: ipsw-${{ env.DEVICE_SLUG }}-${{ env.IOS_BUILD }}

      - name: Download IPSW
        if: steps.cache-ipsw.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ipsw"
          ipsw download ipsw \
            --device "${DEVICE}" \
            --build "${IOS_BUILD}" \
            --output "${GITHUB_WORKSPACE}/ipsw" \
            --confirm

      - name: Extract Kernelcache
        run: |
          set -euo pipefail
          IPSW="$(find "${GITHUB_WORKSPACE}/ipsw" -type f -name '*.ipsw' -print -quit)"
          if [[ -z "${IPSW}" ]]; then
            echo "ERROR: no IPSW found"
            exit 1
          fi
          mkdir -p "${GITHUB_WORKSPACE}/kernel"
          KERNEL="$(find "${GITHUB_WORKSPACE}/kernel" -type f \( -name 'kernelcache*' -o -name '*.kernelcache' \) -print -quit)"
          if [[ -z "${KERNEL}" ]]; then
            ipsw extract --kernel "${IPSW}" --output "${GITHUB_WORKSPACE}/kernel"
            KERNEL="$(find "${GITHUB_WORKSPACE}/kernel" -type f \( -name 'kernelcache*' -o -name '*.kernelcache' \) -print -quit)"
          fi
          if [[ -z "${KERNEL}" ]]; then
            echo "ERROR: kernelcache not found"
            exit 1
          fi
          echo "KERNEL=${KERNEL}" >> "${GITHUB_ENV}"
          ls -lh "${KERNEL}"

      - name: Cache symbolicator signatures
        id: cache-sigs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/symbolicator
          key: symbolicator-main

      - name: Clone Symbolicator
        if: steps.cache-sigs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/blacktop/symbolicator.git \
            "${GITHUB_WORKSPACE}/symbolicator"

      - name: Symbolicate Kernelcache
        run: |
          set -euo pipefail
          rm -f "${GITHUB_WORKSPACE}/symbols.json"
          ipsw kernel symbolicate \
            --signatures "${GITHUB_WORKSPACE}/symbolicator/kernel" \
            --json "${KERNEL}"

          SRC=""
          for cand in "${KERNEL}.symbols.json" "${GITHUB_WORKSPACE}/symbols.json"; do
            if [[ -f "${cand}" ]] && [[ -s "${cand}" ]]; then
              SRC="${cand}"
              break
            fi
          done

          if [[ -z "${SRC}" ]]; then
            SRC="$(find "${GITHUB_WORKSPACE}" /tmp /home/runner -name '*.symbols.json' -size +1k -print -quit 2>/dev/null || true)"
          fi

          if [[ -z "${SRC}" ]]; then
            echo "ERROR: symbolication output not found"
            exit 1
          fi

          cp "${SRC}" "${GITHUB_WORKSPACE}/symbols.json"
          SZ="$(stat -c %s "${GITHUB_WORKSPACE}/symbols.json")"
          if [[ "${SZ}" -lt 1000 ]]; then
            echo "ERROR: symbols.json too small (${SZ} bytes)"
            exit 1
          fi
          echo "[+] symbols.json OK (${SZ} bytes)"

      - name: Cache Ghidra project
        id: cache-project
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-${{ env.DEVICE_SLUG }}-${{ env.IOS_BUILD }}-v1

      - name: Run Ghidra (warm)
        if: steps.cache-project.outputs.cache-hit == 'true'
        env:
          _JAVA_OPTIONS: "-Xmx6g -Djava.awt.headless=true"
        run: |
          set -euo pipefail
          "${GHIDRA_ROOT}/support/analyzeHeadless" \
            "${GITHUB_WORKSPACE}/ghidra_project" KernelProject \
            -process "kernelcache.release.iPhone14,5" \
            -noanalysis \
            -postScript offsets.py \
            -postScript necp_extract.py \
            -scriptPath "${GITHUB_WORKSPACE}/scripts" \
            2>&1 | tee "${GITHUB_WORKSPACE}/ghidra.log"

      - name: Run Ghidra (cold)
        if: steps.cache-project.outputs.cache-hit != 'true'
        env:
          _JAVA_OPTIONS: "-Xmx6g -Djava.awt.headless=true"
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ghidra_project"
          "${GHIDRA_ROOT}/support/analyzeHeadless" \
            "${GITHUB_WORKSPACE}/ghidra_project" KernelProject \
            -import "${KERNEL}" \
            -postScript offsets.py \
            -postScript necp_extract.py \
            -scriptPath "${GITHUB_WORKSPACE}/scripts" \
            -max-cpu 4 \
            -analysisTimeoutPerFile 5400 \
            2>&1 | tee "${GITHUB_WORKSPACE}/ghidra.log"

      - name: Save Ghidra project after cold
        if: steps.cache-project.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-${{ env.DEVICE_SLUG }}-${{ env.IOS_BUILD }}-v1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-offsets-${{ github.sha }}
          path: |
            ${{ github.workspace }}/offsets.txt
            ${{ github.workspace }}/necp_decom.txt
            ${{ github.workspace }}/symbols.json
            ${{ github.workspace }}/ghidra.log
          retention-days: 30
          if-no-files-found: warn