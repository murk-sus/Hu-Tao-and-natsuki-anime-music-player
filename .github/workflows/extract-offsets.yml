name: Extract Offsets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra
          key: ghidra-12.1.2-jython

      - name: Install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/g.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip"
          unzip -q /tmp/g.zip -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/ghidra_12.1.2_PUBLIC" "$GITHUB_WORKSPACE/ghidra"
          JYTHON_ZIP=$(find "$GITHUB_WORKSPACE/ghidra/Extensions/Ghidra" -maxdepth 1 -name "*Jython*.zip" | head -n1)
          test -n "$JYTHON_ZIP"
          mkdir -p "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          unzip -q "$JYTHON_ZIP" -d "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          echo "GHIDRA_ROOT=$GITHUB_WORKSPACE/ghidra" >> "$GITHUB_ENV"

      - name: Set Ghidra env
        shell: bash
        run: echo "GHIDRA_ROOT=$GITHUB_WORKSPACE/ghidra" >> "$GITHUB_ENV"

      - name: Cache ipsw
        id: cache-ipsw
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ipsw
          key: ipsw-3.1.716

      - name: Install ipsw
        if: steps.cache-ipsw.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ipsw.tar.gz "https://github.com/blacktop/ipsw/releases/download/v3.1.716/ipsw_3.1.716_linux_x86_64.tar.gz"
          tar -C /usr/local/bin -xzf /tmp/ipsw.tar.gz ipsw
          ipsw version

      - name: Cache symbolicator
        id: cache-symbolicator
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/symbolicator
          key: symbolicator-v1

      - name: Clone blacktop symbolicator
        if: steps.cache-symbolicator.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/blacktop/symbolicator.git" "$GITHUB_WORKSPACE/symbolicator"

      - name: Inspect signatures (diagnostic)
        shell: bash
        run: |
          set -uo pipefail
          SIGDIR="$GITHUB_WORKSPACE/symbolicator/kernel"
          echo "=== Signatures dir: $SIGDIR ==="
          if [ ! -d "$SIGDIR" ]; then
            echo "FATAL: no kernel subdir in symbolicator"
            ls -la "$GITHUB_WORKSPACE/symbolicator" || true
            exit 1
          fi
          echo "=== Available signature files (first 40) ==="
          ls -1 "$SIGDIR" | head -40
          echo "=== Signature count ==="
          ls -1 "$SIGDIR" | wc -l
          echo "=== Looking for iOS 27 / XNU 13432 signatures ==="
          ls -1 "$SIGDIR" | grep -iE "13432|27\.|iOS.?27" || echo "NOT FOUND — iOS 27 signatures missing"
          echo "=== Sample signature content ==="
          SAMPLE=$(ls -1 "$SIGDIR"/*.json 2>/dev/null | head -n1)
          if [ -n "$SAMPLE" ]; then
            echo "--- $SAMPLE ---"
            head -c 1500 "$SAMPLE"
          fi

      - name: Cache kernelcache
        id: cache-kernelcache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernelcache
          key: kernelcache-iPhone14_5-24A437

      - name: Download IPSW and extract kernelcache
        if: steps.cache-kernelcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ipsw kernelcache
          echo "=== Downloading IPSW ==="
          ipsw download ipsw --device iPhone14,5 --build 24A437 --output ipsw 2>&1 | tee /tmp/dl.log || true
          IPSW=$(find ipsw -name "*.ipsw" -type f | head -n1)
          if [ -z "$IPSW" ]; then
            echo "FATAL: IPSW not downloaded"
            cat /tmp/dl.log
            exit 1
          fi
          ls -lh "$IPSW"
          echo "=== Extracting kernelcache ==="
          ipsw extract --kernel "$IPSW" --output kernelcache
          echo "=== Removing non-kernelcache files ==="
          find kernelcache -type f ! -name "kernelcache*" -print -delete
          find kernelcache -type d -empty -delete
          find kernelcache -type f -exec ls -lh {} \;

      - name: Resolve kernelcache path
        id: kernel
        shell: bash
        run: |
          set -uo pipefail
          KERNEL=$(find "$GITHUB_WORKSPACE/kernelcache" -type f -name "kernelcache*" 2>/dev/null | head -n1)
          if [ -z "$KERNEL" ]; then
            echo "FATAL: kernelcache not found in $GITHUB_WORKSPACE/kernelcache"
            ls -la "$GITHUB_WORKSPACE/kernelcache" || true
            exit 1
          fi
          echo "=== Resolved kernelcache ==="
          file "$KERNEL"
          ls -lh "$KERNEL"
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=$(basename "$KERNEL")" >> "$GITHUB_ENV"

      - name: Decompress kernelcache (only if compressed)
        shell: bash
        run: |
          set -uo pipefail
          echo "=== Checking compression state of: $KERNEL ==="
          FTYPE=$(file "$KERNEL")
          echo "file output: $FTYPE"

          if echo "$FTYPE" | grep -q "Mach-O"; then
            echo "=== kernelcache is already decompressed Mach-O — skipping decompression ==="
            echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
            echo "KERNEL_NAME=$(basename "$KERNEL")" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "=== kernelcache appears compressed (LZFSE/LZSS/Img4) — decompressing ==="
          OUTDIR="$GITHUB_WORKSPACE/kernelcache_decompressed"
          mkdir -p "$OUTDIR"
          OUTNAME="$OUTDIR/$(basename "$KERNEL")"

          # -o = output FILE, not dir
          ipsw kernel dec "$KERNEL" -o "$OUTNAME" 2>&1 | tee /tmp/dec.log || true

          if [ ! -s "$OUTNAME" ]; then
            echo "WARNING: decompression failed or produced empty file"
            echo "=== /tmp/dec.log ==="
            cat /tmp/dec.log || true
            echo "=== falling back to original kernelcache ==="
            echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
            echo "KERNEL_NAME=$(basename "$KERNEL")" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "=== Decompressed ==="
          file "$OUTNAME"
          ls -lh "$OUTNAME"
          echo "KERNEL=$OUTNAME" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=$(basename "$OUTNAME")" >> "$GITHUB_ENV"

      - name: Cache symbols
        id: cache-symbols
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/symbols.json
          key: symbols-${{ hashFiles('kernelcache/**') }}

      - name: Full symbolication with diagnostics
        if: steps.cache-symbols.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -uo pipefail
          SIGDIR="$GITHUB_WORKSPACE/symbolicator/kernel"

          echo "=========================================="
          echo "  Symbolicating: $KERNEL"
          echo "  Signatures:    $SIGDIR"
          echo "=========================================="

          echo "=== Running: ipsw kernel symbolicate -v ==="
          ipsw kernel symbolicate --signatures "$SIGDIR" --json -v "$KERNEL" \
            2>&1 | tee /tmp/sym_full.log || true

          echo ""
          echo "=== symbolicate exit log (tail 50) ==="
          tail -n 50 /tmp/sym_full.log || true

          echo ""
          echo "=== Looking for built-in table markers in log ==="
          grep -iE "bsd_syscall_table|mach_trap_table|mig_kern_subsystem|found .* table" \
            /tmp/sym_full.log || echo "NO BUILT-IN TABLE MARKERS FOUND"

          echo ""
          echo "=== Looking for symbol addresses in log ==="
          grep -cE "0x[0-9A-Fa-f]{10,}" /tmp/sym_full.log || echo "0"

          echo ""
          echo "=== Searching for symbols.json outputs ==="
          find . -type f -name "*.symbols.json" 2>/dev/null | head -5 || true
          find . -type f -name "*symbols*.json" 2>/dev/null | head -5 || true

          SRC=$(find . -type f -name "*.symbols.json" 2>/dev/null | head -n1)
          if [ -z "$SRC" ]; then
            SRC=$(find . -type f -name "*symbols*.json" 2>/dev/null | head -n1)
          fi

          if [ -n "$SRC" ] && [ -s "$SRC" ]; then
            cp "$SRC" "$GITHUB_WORKSPACE/symbols.json"
            echo "=== copied $SRC -> symbols.json ==="
          else
            echo "=== No symbols.json produced by symbolicate ==="
            echo "=== Trying fallback: --output flag ==="
            ipsw kernel symbolicate --signatures "$SIGDIR" --json \
              --output "$GITHUB_WORKSPACE/symbols.json" "$KERNEL" \
              2>&1 | tee /tmp/sym_fallback.log || true
            if [ ! -s "$GITHUB_WORKSPACE/symbols.json" ]; then
              echo "=== Fallback produced nothing — writing [] ==="
              echo "[]" > "$GITHUB_WORKSPACE/symbols.json"
            fi
          fi

          echo ""
          echo "=== symbols.json final size: $(wc -c < "$GITHUB_WORKSPACE/symbols.json" 2>/dev/null || echo 0) bytes ==="
          echo "=== symbols.json head (first 2000 bytes) ==="
          head -c 2000 "$GITHUB_WORKSPACE/symbols.json" 2>/dev/null || true
          echo ""

      - name: Cache ghidra project
        id: cache-project
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-${{ hashFiles('kernelcache/**') }}

      - name: Warm run
        id: warm
        if: steps.cache-project.outputs.cache-hit == 'true'
        continue-on-error: true
        shell: bash
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          "$GHIDRA_ROOT/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
            -process "$KERNEL_NAME" -noanalysis \
            -postScript kernel_rw.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            2>&1 | tee kernel.log || true

      - name: Cold run
        if: steps.cache-project.outputs.cache-hit != 'true' || steps.warm.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          rm -rf ghidra_project
          mkdir -p ghidra_project
          "$GHIDRA_ROOT/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
            -import "$KERNEL" \
            -processor "AARCH64:LE:64:AppleSilicon" \
            -loader BinaryLoader \
            -loader-baseAddr 0xFFFFFFF007004000 \
            -postScript kernel_rw.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -analysisTimeoutPerFile 12000 \
            -max-cpu 4 \
            2>&1 | tee kernel.log || true

      - name: Placeholder
        if: always()
        shell: bash
        run: |
          [ -f result.txt ] || echo "script crashed" > result.txt
          [ -f offsets.json ] || echo "{}" > offsets.json
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-offsets-${{ github.sha }}
          path: |
            result.txt
            offsets.json
            kernel.log
            symbols.json
          retention-days: 30
          if-no-files-found: warn
          overwrite: true