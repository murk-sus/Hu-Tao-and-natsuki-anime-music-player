name: Extract Kernel

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      # ---------- Ghidra ----------
      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra
          key: ghidra-12.1.2-jython

      - name: Install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/g.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip"
          unzip -q /tmp/g.zip -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/ghidra_12.1.2_PUBLIC" "$GITHUB_WORKSPACE/ghidra"
          JYTHON_ZIP=$(find "$GITHUB_WORKSPACE/ghidra/Extensions/Ghidra" -maxdepth 1 -name "*Jython*.zip" | head -n1)
          test -n "$JYTHON_ZIP"
          mkdir -p "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          unzip -q "$JYTHON_ZIP" -d "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"

      - name: Set Ghidra env
        shell: bash
        run: echo "GHIDRA_ROOT=$GITHUB_WORKSPACE/ghidra" >> "$GITHUB_ENV"

      # ---------- ipsw ----------
      - name: Cache ipsw
        id: cache-ipsw
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ipsw
          key: ipsw-3.1.716

      - name: Install ipsw
        if: steps.cache-ipsw.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ipsw.tar.gz "https://github.com/blacktop/ipsw/releases/download/v3.1.716/ipsw_3.1.716_linux_x86_64.tar.gz"
          tar -C /usr/local/bin -xzf /tmp/ipsw.tar.gz ipsw
          ipsw version

      # ---------- symbolicator (только для подписи, если понадобится) ----------
      - name: Cache symbolicator
        id: cache-symbolicator
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/symbolicator
          key: symbolicator-v1

      - name: Clone blacktop symbolicator
        if: steps.cache-symbolicator.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/blacktop/symbolicator.git" "$GITHUB_WORKSPACE/symbolicator"
          ls -la "$GITHUB_WORKSPACE/symbolicator/kernel" | head -20

      # ---------- kernelcache ----------
      - name: Cache kernelcache
        id: cache-kernelcache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernelcache
          key: kernelcache-iPhone14_5-24A437

      - name: Download IPSW and extract kernelcache
        if: steps.cache-kernelcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ipsw kernelcache
          echo "=== Downloading IPSW (iPhone14,5 27.0 24A437) ==="
          ipsw download ipsw --device iPhone14,5 --build 24A437 --output ipsw 2>&1 | tee /tmp/dl.log || true
          IPSW=$(find ipsw -name "*.ipsw" -type f | head -n1)
          if [ -z "$IPSW" ]; then
            echo "FATAL: IPSW not downloaded"
            cat /tmp/dl.log
            exit 1
          fi
          ls -lh "$IPSW"
          echo "=== Extracting kernelcache ==="
          ipsw extract --kernel "$IPSW" --output kernelcache
          echo "=== Removing non-kernelcache files ==="
          find kernelcache -type f ! -name "kernelcache*" -print -delete
          find kernelcache -type d -empty -delete
          find kernelcache -type f -exec ls -lh {} \;

      - name: Resolve kernelcache path
        shell: bash
        run: |
          set -euo pipefail
          KERNEL=$(find "$GITHUB_WORKSPACE/kernelcache" -type f -name "kernelcache*" | head -n1)
          if [ -z "$KERNEL" ]; then
            echo "FATAL: kernelcache not found"
            exit 1
          fi
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=$(basename "$KERNEL")" >> "$GITHUB_ENV"
          file "$KERNEL"
          ls -lh "$KERNEL"

      # ---------- символикация (полный цикл) ----------
      - name: Cache symbols
        id: cache-symbols
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/symbols.json
          key: symbols-${{ hashFiles('kernelcache/**') }}

      - name: Full symbolication (signatures + built-in tables + C++)
        if: steps.cache-symbols.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -uo pipefail
          SIGDIR="$GITHUB_WORKSPACE/symbolicator/kernel"

          echo "=== Step 1: Signature-based symbolication ==="
          ipsw kernel symbolicate --signatures "$SIGDIR" --json "$KERNEL" > /tmp/sym_sig.json 2>&1 || true
          echo "Signature engine output size: $(wc -c < /tmp/sym_sig.json 2>/dev/null || echo 0) bytes"

          echo "=== Step 2: Built-in syscall table ==="
          ipsw kernel syscall "$KERNEL" --json > /tmp/sym_syscall.json 2>&1 || true
          echo "Syscall table output size: $(wc -c < /tmp/sym_syscall.json 2>/dev/null || echo 0) bytes"

          echo "=== Step 3: Built-in mach trap table ==="
          ipsw kernel mach "$KERNEL" --json > /tmp/sym_mach.json 2>&1 || true
          echo "Mach trap table output size: $(wc -c < /tmp/sym_mach.json 2>/dev/null || echo 0) bytes"

          echo "=== Step 4: Built-in MIG subsystem ==="
          ipsw kernel mig "$KERNEL" --json > /tmp/sym_mig.json 2>&1 || true
          echo "MIG output size: $(wc -c < /tmp/sym_mig.json 2>/dev/null || echo 0) bytes"

          echo "=== Step 5: C++ runtime recovery ==="
          ipsw kernel cpp "$KERNEL" --json > /tmp/sym_cpp.json 2>&1 || true
          echo "C++ output size: $(wc -c < /tmp/sym_cpp.json 2>/dev/null || echo 0) bytes"

          echo "=== Merging all symbol sources ==="
          python3 - <<'PYEOF'
          import json, os, sys

          sources = [
              "/tmp/sym_sig.json",
              "/tmp/sym_syscall.json",
              "/tmp/sym_mach.json",
              "/tmp/sym_mig.json",
              "/tmp/sym_cpp.json",
          ]

          merged = {}

          def add(entry):
              if not isinstance(entry, dict): return
              name = entry.get("name") or entry.get("symbol") or entry.get("n")
              addr = entry.get("addr") or entry.get("address") or entry.get("a")
              if not name or addr is None: return
              try:
                  if isinstance(addr, str):
                      addr = int(addr, 16) if addr.startswith("0x") else int(addr)
                  merged[name] = addr
              except: pass

          for path in sources:
              if not os.path.exists(path): continue
              size = os.path.getsize(path)
              if size < 10: continue
              try:
                  with open(path) as f: data = json.load(f)
              except Exception as e:
                  print("[-] parse %s failed: %s" % (path, e))
                  continue

              if isinstance(data, list):
                  for e in data: add(e)
              elif isinstance(data, dict):
                  # syscall/mach/mig формат: {"syscalls": [...]} или {"name": addr}
                  for key in ("syscalls", "traps", "mig", "symbols", "cpp"):
                      if key in data and isinstance(data[key], list):
                          for e in data[key]: add(e)
                  for k, v in data.items():
                      if isinstance(v, (int, str)):
                          try:
                              merged[k] = int(v, 16) if isinstance(v, str) and v.startswith("0x") else int(v)
                          except: pass

          print("[+] Total symbols merged: %d" % len(merged))
          # Специально проверяем NECP
          for name in ["necp_open", "necp_client_action", "necp_client_add_flow", "necp_client_remove_flow", "necp_client_copy_result"]:
              if name in merged:
                  print("[+]   %s = 0x%016X" % (name, merged[name]))
              else:
                  print("[!]   %s NOT FOUND" % name)

          with open(os.path.join(os.environ.get("GITHUB_WORKSPACE", "/tmp"), "symbols.json"), "w") as f:
              json.dump(merged, f, indent=2, sort_keys=True)
          PYEOF

          echo "symbols.json size: $(wc -c < "$GITHUB_WORKSPACE/symbols.json") bytes"

      # ---------- Ghidra ----------
      - name: Cache ghidra project
        id: cache-project
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-${{ hashFiles('kernelcache/**') }}

      - name: Warm run
        id: warm
        if: steps.cache-project.outputs.cache-hit == 'true'
        continue-on-error: true
        shell: bash
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          "$GHIDRA_ROOT/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
            -process "$KERNEL_NAME" -noanalysis \
            -postScript kernel_rw.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            2>&1 | tee kernel.log || true

      - name: Cold run
        if: steps.cache-project.outputs.cache-hit != 'true' || steps.warm.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          rm -rf ghidra_project
          mkdir -p ghidra_project
          "$GHIDRA_ROOT/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
            -import "$KERNEL" \
            -processor "AARCH64:LE:64:AppleSilicon" \
            -loader BinaryLoader \
            -loader-baseAddr 0xFFFFFFF007004000 \
            -postScript kernel_rw.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -analysisTimeoutPerFile 12000 \
            -max-cpu 4 \
            2>&1 | tee kernel.log || true

      - name: Placeholder
        if: always()
        shell: bash
        run: |
          [ -f result.txt ] || echo "script crashed" > result.txt
          [ -f offsets.json ] || echo "{}" > offsets.json
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-${{ github.sha }}
          path: |
            result.txt
            offsets.json
            kernel.log
            symbols.json
          retention-days: 30
          if-no-files-found: warn
          overwrite: true
