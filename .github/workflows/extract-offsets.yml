name: Extract Offsets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - uses: actions/cache@v4
        id: cache-ghidra
        with:
          path: ${{ github.workspace }}/ghidra
          key: ghidra-12.1.2-jython-v4

      - if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/g.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip
          unzip -q /tmp/g.zip -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/ghidra_12.1.2_PUBLIC" "$GITHUB_WORKSPACE/ghidra"
          JYTHON_ZIP=$(find "$GITHUB_WORKSPACE/ghidra/Extensions/Ghidra" -maxdepth 1 -name "*Jython*.zip" | head -n1)
          test -n "$JYTHON_ZIP"
          mkdir -p "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          unzip -q "$JYTHON_ZIP" -d "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          rm -f /tmp/g.zip

      - run: echo "GHIDRA_ROOT=$GITHUB_WORKSPACE/ghidra" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        id: cache-ipsw
        with:
          path: /usr/local/bin/ipsw
          key: ipsw-3.1.716-v4

      - if: steps.cache-ipsw.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ipsw.tar.gz https://github.com/blacktop/ipsw/releases/download/v3.1.716/ipsw_3.1.716_linux_x86_64.tar.gz
          tar -C /usr/local/bin -xzf /tmp/ipsw.tar.gz ipsw
          rm -f /tmp/ipsw.tar.gz

      # v4 -> v5: принудительно тянем свежий клон с сигнатурами 27.x
      - uses: actions/cache@v4
        id: cache-symbolicator
        with:
          path: ${{ github.workspace }}/symbolicator
          key: symbolicator-v5

      - if: steps.cache-symbolicator.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/symbolicator"
          git clone --depth 1 https://github.com/blacktop/symbolicator.git "$GITHUB_WORKSPACE/symbolicator"

      - id: sigs
        name: Pick signature dir
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/symbolicator/kernel"
          echo "=== доступные версии сигнатур ==="
          ls -1 "$ROOT" 2>/dev/null || true

          SIGDIR=""
          SIG_VER=""
          for V in 27.0 27.1 27.2 27.3; do
            if [ -d "$ROOT/$V" ]; then
              SIGDIR="$ROOT/$V"
              SIG_VER="$V"
              break
            fi
          done

          if [ -z "$SIGDIR" ]; then
            LATEST=$(ls -1 "$ROOT" 2>/dev/null | sort -V | tail -n1)
            if [ -n "$LATEST" ]; then
              SIGDIR="$ROOT/$LATEST"
              SIG_VER="$LATEST"
              echo "::warning::27.x нет, использую $LATEST"
            fi
          fi

          echo "SIGDIR=$SIGDIR" >> "$GITHUB_ENV"
          echo "SIG_VER=$SIG_VER" >> "$GITHUB_ENV"
          echo "=== выбрано: SIG_VER=$SIG_VER ==="
          ls -la "$SIGDIR" 2>/dev/null || echo "(empty/missing)"

      - uses: actions/cache@v4
        id: cache-kernelcache
        with:
          path: ${{ github.workspace }}/kernelcache
          key: kernelcache-iPhone14_5-24A437-v4

      - if: steps.cache-kernelcache.outputs.cache-hit != 'true'
        name: Download & extract kernelcache
        run: |
          set -euo pipefail
          mkdir -p ipsw kernelcache
          ipsw download ipsw --device iPhone14,5 --build 24A437 --output ipsw 2>&1 | tee /tmp/dl.log || true
          IPSW=$(find ipsw -name "*.ipsw" -type f | head -n1)
          test -n "$IPSW"
          ipsw extract --kernel "$IPSW" --output kernelcache
          find kernelcache -type f ! -name "kernelcache*" -delete
          find kernelcache -type d -empty -delete
          rm -rf ipsw

      - id: kernel
        name: Locate kernel
        run: |
          set -uo pipefail
          KERNEL=$(find "$GITHUB_WORKSPACE/kernelcache" -type f -name "kernelcache*" | head -n1)
          test -n "$KERNEL"
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=$(basename "$KERNEL")" >> "$GITHUB_ENV"
          file "$KERNEL"

      # v4 -> v5: пересчитываем symbols.json со свежими сигнатурами
      - uses: actions/cache@v4
        id: cache-symbols
        with:
          path: ${{ github.workspace }}/symbols.json
          key: symbols-24A437-v5

      - name: Symbolicate
        if: steps.cache-symbols.outputs.cache-hit != 'true'
        run: |
          set -uo pipefail
          if [ -z "${SIGDIR:-}" ] || [ ! -d "$SIGDIR" ]; then
            echo "::error::SIGDIR не найден: ${SIGDIR:-<empty>}"
            echo "[]" > "$GITHUB_WORKSPACE/symbols.json"
            exit 1
          fi

          ipsw kernel symbolicate \
            --signatures "$SIGDIR" \
            --json -v \
            --output "$GITHUB_WORKSPACE/symbols.json" \
            "$KERNEL" 2>&1 | tee /tmp/sym.log || true

          SZ=0
          [ -f "$GITHUB_WORKSPACE/symbols.json" ] && SZ=$(wc -c < "$GITHUB_WORKSPACE/symbols.json")
          echo "symbols.json size after primary: $SZ"

          # fallback: пусто / "[]" -> встроенные таблицы ядра
          if [ ! -s "$GITHUB_WORKSPACE/symbols.json" ] || [ "$(tr -d ' \n\r\t' < "$GITHUB_WORKSPACE/symbols.json")" = "[]" ]; then
            echo "=== fallback: symbolicate без --signatures ==="
            ipsw kernel symbolicate \
              --json -v \
              --output "$GITHUB_WORKSPACE/symbols.json" \
              "$KERNEL" 2>&1 | tee /tmp/sym_fb.log || true
          fi

          if [ ! -s "$GITHUB_WORKSPACE/symbols.json" ]; then
            echo "[]" > "$GITHUB_WORKSPACE/symbols.json"
          fi
          echo "final symbols.json: $(wc -c < "$GITHUB_WORKSPACE/symbols.json") bytes"

      - name: Validate symbols.json
        run: |
          set -uo pipefail
          F="$GITHUB_WORKSPACE/symbols.json"
          if ! python3 -c "import json,sys; d=json.load(open('$F')); sys.exit(0 if d else 2)"; then
            echo "::error::symbols.json пустой или невалидный"
            exit 1
          fi
          echo "symbols.json OK"

      # ключ НЕ меняем: сохраняем warm-run Ghidra
      - uses: actions/cache@v4
        id: cache-project
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-24A437-v4

      - name: Run Ghidra
        continue-on-error: true
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          if [ "${{ steps.cache-project.outputs.cache-hit }}" = "true" ]; then
            echo "=== warm ==="
            "$GHIDRA_ROOT/support/analyzeHeadless" \
              "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
              -process "$KERNEL_NAME" -noanalysis \
              -postScript kernel_rw.py \
              -scriptPath "$GITHUB_WORKSPACE/scripts" \
              2>&1 | tee kernel.log || true
          else
            echo "=== cold ==="
            rm -rf ghidra_project
            mkdir -p ghidra_project
            "$GHIDRA_ROOT/support/analyzeHeadless" \
              "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
              -import "$KERNEL" \
              -processor "AARCH64:LE:64:AppleSilicon" \
              -loader BinaryLoader \
              -loader-baseAddr 0xFFFFFFF007004000 \
              -postScript kernel_rw.py \
              -scriptPath "$GITHUB_WORKSPACE/scripts" \
              -analysisTimeoutPerFile 12000 \
              -max-cpu 4 \
              2>&1 | tee kernel.log || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-offsets-${{ github.sha }}
          path: |
            result.txt
            offsets.json
            kernel.log
            symbols.json
          retention-days: 30
          if-no-files-found: warn
          overwrite: true
          compression-level: 9

      - name: Cleanup workspace
        if: always()
        run: |
          set +e
          rm -rf "$GITHUB_WORKSPACE/ipsw"           2>/dev/null
          rm -rf "$GITHUB_WORKSPACE/kernelcache"    2>/dev/null
          rm -rf "$GITHUB_WORKSPACE/symbolicator"   2>/dev/null
          rm -rf "$GITHUB_WORKSPACE/ghidra"         2>/dev/null
          rm -rf "$GITHUB_WORKSPACE/ghidra_project" 2>/dev/null
          rm -f  /tmp/g.zip /tmp/ipsw.tar.gz /tmp/sym.log /tmp/sym_fb.log /tmp/dl.log 2>/dev/null
          rm -rf "$HOME/.config/ghidra"             2>/dev/null
          rm -rf /var/tmp/runner-ghidra             2>/dev/null
          exit 0