name: Extract Offsets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - uses: actions/cache@v4
        id: cache-ghidra
        with:
          path: ${{ github.workspace }}/ghidra
          key: ghidra-12.1.2-jython-v4

      - if: steps.cache-ghidra.outputs.cache-hit != 'true'
        name: Install Ghidra
        run: |
          set -euo pipefail
          echo "=== Ghidra cache MISS ==="
          df -h /
          curl -fsSL -o /tmp/g.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip
          unzip -q /tmp/g.zip -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/ghidra_12.1.2_PUBLIC" "$GITHUB_WORKSPACE/ghidra"
          JYTHON_ZIP=$(find "$GITHUB_WORKSPACE/ghidra/Extensions/Ghidra" -maxdepth 1 -name "*Jython*.zip" | head -n1)
          echo "JYTHON_ZIP=$JYTHON_ZIP"
          test -n "$JYTHON_ZIP"
          mkdir -p "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          unzip -q "$JYTHON_ZIP" -d "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          rm -f /tmp/g.zip

      - name: Set GHIDRA_ROOT
        run: echo "GHIDRA_ROOT=$GITHUB_WORKSPACE/ghidra" >> "$GITHUB_ENV"

      - name: Validate Ghidra
        run: |
          set -euo pipefail
          echo "GHIDRA_ROOT=$GHIDRA_ROOT"
          test -x "$GHIDRA_ROOT/support/analyzeHeadless"
          test -d "$GHIDRA_ROOT/Ghidra/Extensions/Jython"
          ls -la "$GHIDRA_ROOT/support/analyzeHeadless"
          ls -la "$GHIDRA_ROOT/Ghidra/Extensions/Jython" | head -5
          echo "Ghidra OK"

      - uses: actions/cache@v4
        id: cache-ipsw
        with:
          path: /usr/local/bin/ipsw
          key: ipsw-3.1.716-v4

      - if: steps.cache-ipsw.outputs.cache-hit != 'true'
        name: Install ipsw
        run: |
          set -euo pipefail
          echo "=== ipsw cache MISS ==="
          curl -fsSL -o /tmp/ipsw.tar.gz https://github.com/blacktop/ipsw/releases/download/v3.1.716/ipsw_3.1.716_linux_x86_64.tar.gz
          tar -C /usr/local/bin -xzf /tmp/ipsw.tar.gz ipsw
          rm -f /tmp/ipsw.tar.gz

      - name: Validate ipsw
        run: |
          set -euo pipefail
          test -x /usr/local/bin/ipsw
          /usr/local/bin/ipsw version
          echo "ipsw OK"

      - uses: actions/cache@v4
        id: cache-symbolicator
        with:
          path: ${{ github.workspace }}/symbolicator
          key: symbolicator-v8

      - if: steps.cache-symbolicator.outputs.cache-hit != 'true'
        name: Clone symbolicator
        run: |
          set -euo pipefail
          echo "=== symbolicator cache MISS ==="
          rm -rf "$GITHUB_WORKSPACE/symbolicator"
          git clone --depth 1 https://github.com/blacktop/symbolicator.git "$GITHUB_WORKSPACE/symbolicator"

      - name: Inspect symbolicator 27.0
        run: |
          ROOT="$GITHUB_WORKSPACE/symbolicator/kernel"
          test -d "$ROOT" || { echo "::error::no kernel dir"; exit 1; }
          echo "=== versions ==="
          ls -1 "$ROOT"
          echo ""
          echo "=== 27.0 contents ==="
          if [ -d "$ROOT/27.0" ]; then
            ls -la "$ROOT/27.0" 2>&1 | head -20 || true
            echo ""
            if [ -f "$ROOT/27.0/xnu.json" ]; then
              echo "xnu.json: $(wc -c < "$ROOT/27.0/xnu.json") bytes"
            else
              echo "no xnu.json"
            fi
            if [ -d "$ROOT/27.0/kexts" ]; then
              N=$(find "$ROOT/27.0/kexts" -maxdepth 1 -type f -name "*.json" 2>/dev/null | wc -l)
              echo "kexts json: $N"
            fi
          else
            echo "NO 27.0"
          fi
          exit 0

      - uses: actions/cache@v4
        id: cache-kernelcache
        with:
          path: ${{ github.workspace }}/kernelcache
          key: kernelcache-iPhone14_5-24A437-v4

      - if: steps.cache-kernelcache.outputs.cache-hit != 'true'
        name: Download and extract kernelcache
        run: |
          set -euo pipefail
          echo "=== kernelcache cache MISS ==="
          mkdir -p ipsw kernelcache
          ipsw download ipsw --device iPhone14,5 --build 24A437 --output ipsw 2>&1 | tee /tmp/dl.log || true
          IPSW=$(find ipsw -name "*.ipsw" -type f | head -n1)
          echo "IPSW=$IPSW"
          test -n "$IPSW"
          test -s "$IPSW"
          ipsw extract --kernel "$IPSW" --output kernelcache
          find kernelcache -type f ! -name "kernelcache*" -delete
          find kernelcache -type d -empty -delete
          rm -rf ipsw

      - id: kernel
        name: Locate and validate kernel
        run: |
          set -euo pipefail
          KERNEL=$(find "$GITHUB_WORKSPACE/kernelcache" -type f -name "kernelcache*" | head -n1)
          echo "KERNEL=$KERNEL"
          test -n "$KERNEL"
          test -s "$KERNEL"
          file "$KERNEL" | grep -qi "Mach-O" || (echo "::error::not Mach-O"; exit 1)
          ls -la "$KERNEL"
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=$(basename "$KERNEL")" >> "$GITHUB_ENV"

      - name: Validate scripts
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/scripts/kernel_rw.py"
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$GITHUB_WORKSPACE/scripts/kernel_rw.py"
          echo "kernel_rw.py OK"

      - uses: actions/cache@v4
        id: cache-symbols
        with:
          path: ${{ github.workspace }}/symbols.json
          key: symbols-24A437-27.0-v9

      - name: Symbolicate 27.0
        if: steps.cache-symbols.outputs.cache-hit != 'true'
        run: |
          OUT="$GITHUB_WORKSPACE/symbols.json"
          echo "[]" > "$OUT"

          count_entries() {
            jq 'if type=="array" then length elif type=="object" then (keys|length) else 0 end' "$1" 2>/dev/null || echo 0
          }

          run_sign() {
            SIG="$1"
            TAG="$2"
            if [ -z "$SIG" ]; then
              echo "--- skip [$TAG]: empty"
              return 1
            fi
            if [ ! -e "$SIG" ]; then
              echo "--- skip [$TAG]: not exists $SIG"
              return 1
            fi
            echo "--- try [$TAG] sig=$SIG"
            ipsw kernel symbolicate --signatures "$SIG" --json "$KERNEL" \
              > /tmp/sym_out.txt 2>/tmp/sym_err.txt
            RC=$?
            SZ=$(wc -c < /tmp/sym_out.txt 2>/dev/null || echo 0)
            echo "  rc=$RC bytes=$SZ"
            if [ -s /tmp/sym_err.txt ]; then
              echo "  stderr (head):"
              head -8 /tmp/sym_err.txt 2>/dev/null | sed 's/^/    /' || true
            fi
            if [ -s /tmp/sym_out.txt ]; then
              echo "  stdout (head 200):"
              head -c 200 /tmp/sym_out.txt 2>/dev/null | sed 's/^/    /' || true
              echo ""
            fi
            if [ -s /tmp/sym_out.txt ] && jq empty /tmp/sym_out.txt 2>/dev/null; then
              N=$(count_entries /tmp/sym_out.txt)
              echo "  entries=$N"
              if [ "$N" -gt 0 ]; then
                cp /tmp/sym_out.txt "$OUT"
                echo "OK [$TAG]: $N"
                return 0
              fi
            fi
            return 1
          }

          SIG_ROOT="$GITHUB_WORKSPACE/symbolicator/kernel/27.0"

          echo "=== [1] primary: full 27.0 dir (xnu + kexts) ==="
          run_sign "$SIG_ROOT" "27.0-full" || true

          if [ "$(count_entries "$OUT")" = "0" ]; then
            echo ""
            echo "=== [2] xnu.json only ==="
            run_sign "$SIG_ROOT/xnu.json" "27.0-xnu" || true
          fi

          if [ "$(count_entries "$OUT")" = "0" ]; then
            echo ""
            echo "=== [3] kexts only ==="
            run_sign "$SIG_ROOT/kexts" "27.0-kexts" || true
          fi

          if [ "$(count_entries "$OUT")" = "0" ]; then
            echo ""
            echo "=== [4] ipsw builtin tables ==="
            ipsw kernel symbolicate --json "$KERNEL" > /tmp/sym_out.txt 2>/tmp/sym_err.txt
            RC=$?
            echo "  rc=$RC bytes=$(wc -c < /tmp/sym_out.txt 2>/dev/null || echo 0)"
            if [ -s /tmp/sym_err.txt ]; then
              head -8 /tmp/sym_err.txt 2>/dev/null | sed 's/^/    /' || true
            fi
            if [ -s /tmp/sym_out.txt ] && jq empty /tmp/sym_out.txt 2>/dev/null; then
              N=$(count_entries /tmp/sym_out.txt)
              echo "  entries=$N"
              if [ "$N" -gt 0 ]; then
                cp /tmp/sym_out.txt "$OUT"
                echo "OK [builtin]: $N"
              fi
            fi
          fi

          if ! jq empty "$OUT" 2>/dev/null; then
            echo "::warning::symbols.json invalid, reset"
            echo "[]" > "$OUT"
          fi

          FINAL=$(count_entries "$OUT")
          echo ""
          echo "=== FINAL: bytes=$(wc -c < "$OUT") entries=$FINAL ==="
          if [ "$FINAL" = "0" ]; then
            echo "::warning::no symbols"
          fi
          echo ""
          echo "=== first 800 bytes ==="
          head -c 800 "$OUT" 2>/dev/null || true
          echo ""
          exit 0

      - name: Validate symbols.json
        if: always()
        continue-on-error: true
        run: |
          F="$GITHUB_WORKSPACE/symbols.json"
          if [ ! -f "$F" ]; then
            echo "::warning::symbols.json missing"
            exit 0
          fi
          if ! jq empty "$F" 2>/dev/null; then
            echo "::warning::symbols.json invalid"
            exit 0
          fi
          TYPE=$(jq -r 'type' "$F")
          CNT=$(jq 'if type == "array" then length elif type == "object" then (keys | length) else 0 end' "$F")
          echo "top-level: $TYPE, entries: $CNT"
          exit 0

      - uses: actions/cache@v4
        id: cache-project
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-24A437-v4

      - name: Run Ghidra
        continue-on-error: true
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          echo "=== cache status ==="
          echo "  ghidra:       ${{ steps.cache-ghidra.outputs.cache-hit }}"
          echo "  ipsw:         ${{ steps.cache-ipsw.outputs.cache-hit }}"
          echo "  symbolicator: ${{ steps.cache-symbolicator.outputs.cache-hit }}"
          echo "  kernelcache:  ${{ steps.cache-kernelcache.outputs.cache-hit }}"
          echo "  symbols:      ${{ steps.cache-symbols.outputs.cache-hit }}"
          echo "  project:      ${{ steps.cache-project.outputs.cache-hit }}"
          echo ""
          echo "=== symbols.json ==="
          if [ -f "$SYMBOLS_JSON" ]; then
            SZ=$(wc -c < "$SYMBOLS_JSON")
            echo "  size=$SZ bytes"
            head -c 200 "$SYMBOLS_JSON" 2>/dev/null || true
            echo ""
          else
            echo "  not found"
          fi
          echo ""
          if [ "${{ steps.cache-project.outputs.cache-hit }}" = "true" ]; then
            echo "=== warm run ==="
            "$GHIDRA_ROOT/support/analyzeHeadless" \
              "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
              -process "$KERNEL_NAME" -noanalysis \
              -postScript kernel_rw.py \
              -scriptPath "$GITHUB_WORKSPACE/scripts" \
              2>&1 | tee kernel.log || true
          else
            echo "=== cold run ==="
            rm -rf ghidra_project
            mkdir -p ghidra_project
            "$GHIDRA_ROOT/support/analyzeHeadless" \
              "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
              -import "$KERNEL" \
              -processor "AARCH64:LE:64:AppleSilicon" \
              -loader BinaryLoader \
              -loader-baseAddr 0xFFFFFFF007004000 \
              -postScript kernel_rw.py \
              -scriptPath "$GITHUB_WORKSPACE/scripts" \
              -analysisTimeoutPerFile 12000 \
              -max-cpu 4 \
              2>&1 | tee kernel.log || true
          fi

      - name: Validate outputs
        if: always()
        continue-on-error: true
        run: |
          echo "=== result.txt ==="
          if [ -s result.txt ]; then
            echo "lines: $(wc -l < result.txt)"
            head -30 result.txt 2>/dev/null || true
          else
            echo "::warning::result.txt empty"
          fi
          echo ""
          echo "=== offsets.json ==="
          if [ -s offsets.json ] && jq empty offsets.json 2>/dev/null; then
            echo "valid, bytes=$(wc -c < offsets.json)"
            jq -r 'if type=="object" then keys[] else . end' offsets.json 2>/dev/null | head -30 || true
          else
            echo "::warning::offsets.json empty/invalid"
          fi
          echo ""
          echo "=== kernel.log tail ==="
          tail -n 40 kernel.log 2>/dev/null || echo "(no kernel.log)"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-offsets-${{ github.sha }}
          path: |
            result.txt
            offsets.json
            kernel.log
            symbols.json
          retention-days: 30
          if-no-files-found: warn
          overwrite: true
          compression-level: 9

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/ipsw" "$GITHUB_WORKSPACE/kernelcache" \
                 "$GITHUB_WORKSPACE/symbolicator" "$GITHUB_WORKSPACE/ghidra" \
                 "$GITHUB_WORKSPACE/ghidra_project"
          rm -f /tmp/g.zip /tmp/ipsw.tar.gz /tmp/sym_out.txt /tmp/sym_err.txt /tmp/dl.log
          rm -rf /tmp/sigs /tmp/sig.tar.gz
          rm -rf "$HOME/.config/ghidra" /var/tmp/runner-ghidra
          exit 0