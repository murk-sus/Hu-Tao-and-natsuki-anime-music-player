name: Extract Kernel

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      # --- Ghidra 12.1.2 + Jython extension ---
      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra
          key: ghidra-12.1.2-jython

      - name: Install Ghidra 12.1.2
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/g.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip
          unzip -q /tmp/g.zip -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE"/ghidra_12.1.2_PUBLIC "$GITHUB_WORKSPACE/ghidra"

          echo "=== Extensions/Ghidra contents ==="
          ls -la "$GITHUB_WORKSPACE/ghidra/Extensions/Ghidra/" || true

          JYTHON_ZIP=$(find "$GITHUB_WORKSPACE/ghidra/Extensions/Ghidra" -maxdepth 1 -name '*Jython*.zip' | head -n1)
          if [ -z "$JYTHON_ZIP" ]; then
            echo "FATAL: Jython extension zip not found"
            ls -la "$GITHUB_WORKSPACE/ghidra/Extensions/Ghidra/" || true
            exit 1
          fi
          echo "Found: $JYTHON_ZIP"

          mkdir -p "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          unzip -q "$JYTHON_ZIP" -d "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"

          echo "GHIDRA_ROOT=$GITHUB_WORKSPACE/ghidra" >> "$GITHUB_ENV"

      - name: Set Ghidra env
        run: echo "GHIDRA_ROOT=$GITHUB_WORKSPACE/ghidra" >> "$GITHUB_ENV"

      # --- ipsw 3.1.716 ---
      - name: Cache ipsw
        id: cache-ipsw
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ipsw
          key: ipsw-3.1.716

      - name: Install ipsw 3.1.716
        if: steps.cache-ipsw.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ipsw.tar.gz \
            https://github.com/blacktop/ipsw/releases/download/v3.1.716/ipsw_3.1.716_linux_x86_64.tar.gz
          tar -C /usr/local/bin -xzf /tmp/ipsw.tar.gz ipsw
          ipsw version

      # --- symbolicator 26.8.0 ---
      - name: Cache symbolicator
        id: cache-symbolicator
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/symbolicator
          key: symbolicator-26.8.0

      - name: Clone symbolicator 26.8.0
        if: steps.cache-symbolicator.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 26.8.0 \
            https://github.com/getsentry/symbolicator.git "$GITHUB_WORKSPACE/symbolicator"

      # --- verified_all_92.json ---
      - name: Cache verified offsets
        id: cache-verified
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/verified_all_92.json
          key: verified-all-92-latest

      - name: Download verified_all_92.json
        if: steps.cache-verified.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o "$GITHUB_WORKSPACE/verified_all_92.json" \
            "https://raw.githubusercontent.com/jianbuzhai698-ui/ios/main/client/verified_all_92.json"
          test -s "$GITHUB_WORKSPACE/verified_all_92.json"

      # --- Распаковка kernel ---
      - name: Unpack kernel
        run: |
          set -euo pipefail
          mkdir -p kernel
          unzip -o kernel.zip -d kernel
          K=$(find kernel -type f \( -name 'kernel.raw' -o -name 'kernelcache*' \) -print -quit)
          test -n "$K"
          echo "KERNEL=$K" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=$(basename "$K")" >> "$GITHUB_ENV"
          ls -lh "$K"

      # --- Извлечение KEXT ---
      - name: Extract all KEXTs
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kexts"
          ipsw kernel extract "$KERNEL" --all --output "$GITHUB_WORKSPACE/kexts" || true
          echo "=== kexts ==="
          ls -la "$GITHUB_WORKSPACE/kexts" | head -50
          echo "KEXTS_DIR=$GITHUB_WORKSPACE/kexts" >> "$GITHUB_ENV"

      # --- symbols.json ---
      - name: Cache symbols
        id: cs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/symbols.json
          key: symbols-${{ hashFiles('kernel.zip') }}

      - name: Symbolicate
        if: steps.cs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ipsw kernel sym "$KERNEL" --json --signatures "$GITHUB_WORKSPACE/symbolicator/kernel"
          SRC="${KERNEL}.json"
          if [ ! -f "$SRC" ]; then SRC=$(find kernel -name '*.json' -print -quit); fi
          test -f "$SRC"
          cp "$SRC" "$GITHUB_WORKSPACE/symbols.json"
          test -s "$GITHUB_WORKSPACE/symbols.json"

      # --- Ghidra project ---
      - name: Cache project
        id: cp
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ghidra_project
          key: ghidra-project-${{ hashFiles('kernel.zip') }}

      - name: Warm
        id: w
        if: steps.cp.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          VERIFIED_JSON: ${{ github.workspace }}/verified_all_92.json
          KEXTS_DIR: ${{ github.workspace }}/kexts
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          "$GHIDRA_ROOT/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
            -process "$KERNEL_NAME" -noanalysis \
            -postScript kernel_rw.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            2>&1 | tee kernel.log || true

      - name: Cold
        if: steps.cp.outputs.cache-hit != 'true' || steps.w.outcome != 'success'
        continue-on-error: true
        env:
          _JAVA_OPTIONS: "-Xmx8g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          VERIFIED_JSON: ${{ github.workspace }}/verified_all_92.json
          KEXTS_DIR: ${{ github.workspace }}/kexts
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          rm -rf ghidra_project
          mkdir -p ghidra_project
          "$GHIDRA_ROOT/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
            -import "$KERNEL" \
            -postScript kernel_rw.py \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -analysisTimeoutPerFile 12000 \
            -max-cpu 4 \
            2>&1 | tee kernel.log || true

      - name: Placeholder
        if: always()
        run: |
          [ -f result.txt ] || echo 'script crashed' > result.txt
          [ -f offsets.json ] || echo '{}' > offsets.json
          ls -la

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-${{ github.sha }}
          path: |
            result.txt
            offsets.json
            kernel.log
            symbols.json
          retention-days: 30
          if-no-files-found: warn
          overwrite: true